<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>브레드의 기분 빵 상자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&family=Gowun+Dodum&display=swap">
<style>
/* 이미지·소리 파일은 assets/ 폴더에 넣으면 자동으로 바뀝니다. 파일이 없으면 기본 디자인이 나옵니다. */
:root{
  --night:#2b1810;--crust:#a45a2a;--butter:#ffd45c;--cream:#fff5df;--ink:#3b2215;
  --berry:#ff5d8f;--mint:#2fbf83;--burn:#e0452f;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --eng:"Fredoka","Jua",system-ui,sans-serif;
  --body:"Gowun Dodum","Jua",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--cream);font-family:var(--body);overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--butter);outline-offset:3px}
img{max-width:100%}
[hidden]{display:none!important}

/* 배경 */
#bgLayer{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 80% 55% at 50% 110%,rgba(255,170,80,.45),transparent 70%),linear-gradient(180deg,#24140d 0%,#3d2014 45%,#6a3219 100%);
  background-size:cover;background-position:center}
#bgLayer.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,5,.15),rgba(20,10,5,.35))}
.lights{position:fixed;inset:0 0 auto;height:46px;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 20px 22px,var(--butter) 0 6px,rgba(255,212,92,.35) 7px 13px,transparent 14px) 0 0/80px 46px repeat-x,
   radial-gradient(circle at 60px 30px,#ffb35c 0 6px,rgba(255,179,92,.3) 7px 13px,transparent 14px) 0 0/80px 46px repeat-x}
body.hasBg .lights{display:none}

.screen{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding-block:52px 24px;min-height:100%;display:flex;flex-direction:column;gap:18px}

/* 간판 / 로고 */
.sign{align-self:center;position:relative;padding:18px 40px 22px;border-radius:22px;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 3px,transparent 3px 14px),linear-gradient(180deg,#c9773a,#9a4f22);
  border:5px solid #5a2d14;box-shadow:0 8px 0 #4a240f,0 18px 40px rgba(0,0,0,.45);text-align:center;transform:rotate(-1.5deg)}
.sign h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,76px);line-height:1.05;color:var(--butter);
  text-shadow:0 4px 0 #5a2d14,3px 0 0 #5a2d14,-3px 0 0 #5a2d14,0 -3px 0 #5a2d14,3px 3px 0 #5a2d14,-3px 3px 0 #5a2d14,3px -3px 0 #5a2d14,-3px -3px 0 #5a2d14}
.sign h1 .pink{color:#ffb3cb}
.sign p{margin:6px 0 0;font-family:var(--display);font-size:clamp(14px,1.8vw,20px);color:#ffe9c4}
.logoImg{align-self:center;max-height:32vh;max-width:min(760px,100%);border-radius:24px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.45))}
.subLine{align-self:center;font-family:var(--display);font-size:clamp(16px,2vw,22px);background:rgba(43,24,16,.75);padding:6px 18px;border-radius:999px}

/* 설정 */
.panel{background:var(--cream);color:var(--ink);border-radius:26px;padding:24px clamp(16px,3vw,36px);border:4px solid #e6c58f;
  box-shadow:0 10px 0 #c99a5a,0 24px 50px rgba(0,0,0,.35);width:min(860px,100%);align-self:center}
.panel h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.6vw,30px);margin:0 0 12px}
.countRow{display:flex;flex-wrap:wrap;gap:10px}
.countBtn{width:clamp(56px,8vw,78px);aspect-ratio:1;border-radius:50% 50% 18px 18px;border:4px solid #b06c34;background:#f6d39a;
  font-family:var(--eng);font-weight:700;font-size:clamp(24px,3vw,34px);color:var(--ink);box-shadow:0 5px 0 #b06c34}
.countBtn[aria-pressed="true"]{background:var(--butter);border-color:#7a3b1f;box-shadow:0 5px 0 #7a3b1f;transform:translateY(-4px)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:16px}
.names label{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;border:3px solid var(--c)}
.names .dot{width:36px;height:36px;border-radius:50% 50% 8px 8px;background:var(--c);flex:none;overflow:hidden;display:grid;place-items:center}
.names .dot img{width:100%;height:100%;object-fit:cover}
.names input{flex:1;min-width:0;border:0;font-family:var(--display);font-size:20px;color:var(--ink);background:transparent}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:18px 0 6px;padding:0;list-style:none}
.rules li{background:#fbe7c4;border-radius:14px;padding:10px 14px;font-size:16px;line-height:1.45}
.rules b{font-family:var(--display);font-weight:400;font-size:18px;display:block;color:#8a3d18}
.startRow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.bigBtn{font-family:var(--display);font-size:clamp(22px,2.6vw,30px);padding:14px 34px;border-radius:999px;border:4px solid #5a2d14;background:var(--berry);color:#fff;box-shadow:0 7px 0 #8f2246}
.bigBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #8f2246}
.bigBtn.alt{background:#f6d39a;color:var(--ink);box-shadow:0 7px 0 #b06c34;border-color:#b06c34}

/* 게임 */
.topBar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.miniSign{font-family:var(--display);font-size:clamp(20px,2.4vw,28px);color:var(--butter);padding:6px 18px;border-radius:12px;
  background:linear-gradient(180deg,#c9773a,#9a4f22);border:3px solid #5a2d14;box-shadow:0 4px 0 #4a240f}
.miniSign img{display:block;height:56px;width:auto}
.miniSign.hasImg{padding:0;background:none;border:0;box-shadow:none}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tool{font-family:var(--display);font-size:17px;padding:8px 16px;border-radius:999px;border:3px solid #e6c58f;background:rgba(43,24,16,.7);color:var(--cream)}
.tool:hover{background:rgba(90,45,20,.85)}

.teams{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:12px;margin-top:10px}
.team{position:relative;background:var(--c);color:#fff;border-radius:46% 46% 18px 18px/38% 38% 18px 18px;padding:12px 8px 10px;text-align:center;
  border:4px solid rgba(0,0,0,.25);box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .2s,box-shadow .2s;min-width:0}
.team .tok{width:46px;height:46px;margin:0 auto 2px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.85);border:3px solid #fff}
.team .tok img{width:100%;height:100%;object-fit:cover}
.team .tName{font-family:var(--display);font-size:clamp(15px,1.6vw,21px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.team .tScore{font-family:var(--eng);font-weight:700;font-size:clamp(34px,4.4vw,58px);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.team .adj{display:flex;justify-content:center;gap:6px;margin-top:4px}
.team .adj button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:rgba(0,0,0,.18);color:#fff;font-family:var(--eng);font-weight:700;font-size:18px;line-height:1}
.team.now{transform:translateY(-8px) scale(1.04);box-shadow:0 0 0 5px var(--butter),0 0 34px 8px rgba(255,212,92,.65),0 10px 0 rgba(0,0,0,.3)}
.team.now::before{content:"우리 차례!";position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--butter);color:var(--ink);
  font-family:var(--display);font-size:15px;padding:2px 12px;border-radius:999px;white-space:nowrap;border:2px solid #5a2d14;z-index:2}
.pop{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-family:var(--eng);font-weight:700;font-size:40px;color:var(--butter);
  text-shadow:0 3px 0 #5a2d14;pointer-events:none;animation:floatUp 1.2s ease-out forwards}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}

.stage{flex:1;display:flex;align-items:flex-start;justify-content:center}
.order{position:relative;width:min(1120px,100%);background:var(--cream);color:var(--ink);border-radius:26px;
  padding:20px clamp(16px,3vw,36px) 24px;border:4px solid #e6c58f;box-shadow:0 10px 0 #c99a5a,0 26px 60px rgba(0,0,0,.4);display:grid;gap:14px}
.qHead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.tag{font-family:var(--display);font-size:clamp(18px,2vw,24px);background:var(--c,#8a3d18);color:#fff;padding:5px 18px;border-radius:999px}
.qNo{font-family:var(--display);color:#9a6a45;font-size:18px}
.qMain{display:flex;gap:20px;align-items:center}
.host{flex:none;width:clamp(120px,15vw,200px);aspect-ratio:1;border-radius:24px;overflow:hidden;background:#fbe7c4;border:4px solid #e6c58f}
.host img{width:100%;height:100%;object-fit:cover}
.qBody{flex:1;min-width:0;display:grid;gap:10px}
.prompt{font-family:var(--display);font-size:clamp(26px,3.4vw,44px);line-height:1.3;text-align:center;text-wrap:balance;margin:0}
.prompt .en{font-family:var(--eng);font-weight:600}
.visual{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;font-size:clamp(56px,8vw,104px);line-height:1.1;min-height:1.2em;text-align:center}
.visual.count{font-size:clamp(40px,5vw,62px);max-width:820px;margin:0 auto}
.visual.spell{font-family:var(--eng);font-weight:700;letter-spacing:.18em;font-size:clamp(48px,7vw,92px)}
.visual.word{font-family:var(--eng);font-weight:700;font-size:clamp(48px,7vw,88px);color:#8a3d18}
.listen{justify-self:center;font-family:var(--display);font-size:22px;padding:10px 26px;border-radius:999px;border:3px solid #5a2d14;background:var(--butter);color:var(--ink);box-shadow:0 5px 0 #b07a1c}
.said{text-align:center;font-family:var(--eng);font-weight:600;font-size:26px;color:#8a3d18}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 18px;border-radius:18px;border:4px solid #d9b07a;background:#fff;color:var(--ink);box-shadow:0 6px 0 #d9b07a;min-width:0}
.opt:hover{transform:translateY(-2px)}
.opt .k{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--eng);font-weight:700;font-size:24px;color:#fff;background:var(--kc)}
.opt .v{font-family:var(--eng);font-weight:600;font-size:clamp(22px,2.7vw,34px);line-height:1.2;min-width:0;overflow-wrap:anywhere}
.opt .v.ko{font-family:var(--display);font-weight:400}
.opt .v.emo{font-size:clamp(40px,5vw,62px)}
.opt.right{background:#d8f7e8;border-color:var(--mint);box-shadow:0 6px 0 var(--mint)}
.opt.wrong{background:#ffe0da;border-color:var(--burn);box-shadow:0 6px 0 var(--burn);animation:shake .4s}
.opt.dim{opacity:.45}
.opts.locked .opt{pointer-events:none}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.result{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.react{width:clamp(90px,10vw,140px);aspect-ratio:1;border-radius:20px;overflow:hidden}
.react img{width:100%;height:100%;object-fit:cover}
.verdict{font-family:var(--display);font-size:clamp(26px,3.4vw,40px);text-align:center;margin:0}
.verdict.good{color:var(--mint)}.verdict.bad{color:var(--burn)}
.qFoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.small{font-family:var(--display);font-size:18px;padding:8px 18px;border-radius:999px;border:3px solid #d9b07a;background:#fbe7c4;color:var(--ink)}
.go{font-family:var(--display);font-size:clamp(20px,2.4vw,28px);padding:12px 30px;border-radius:999px;border:4px solid #5a2d14;background:var(--berry);color:#fff;box-shadow:0 6px 0 #8f2246}
.go.mint{background:var(--mint);box-shadow:0 6px 0 #1b7a52}

/* 상자 */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(30,15,8,.88);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.overlay.img{background-blend-mode:multiply;background-color:rgba(60,30,15,.55)}
.ovInner{width:min(1100px,100%);display:flex;flex-direction:column;gap:18px;align-items:center}
.ovTitle{font-family:var(--display);font-size:clamp(28px,4vw,52px);color:var(--butter);text-align:center;margin:0;text-shadow:0 4px 0 #5a2d14}
.ovSub{font-family:var(--display);font-size:clamp(18px,2vw,26px);color:#ffe9c4;margin:0;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,26px);width:100%}
.box{position:relative;aspect-ratio:1/0.82;border:0;background:none;padding:0}
.box .body{position:absolute;inset:22% 4% 0;border-radius:12px;background:var(--bc);border:4px solid rgba(0,0,0,.28);box-shadow:0 8px 0 rgba(0,0,0,.3);
  background-image:linear-gradient(90deg,transparent 44%,rgba(255,255,255,.85) 44% 56%,transparent 56%)}
.box .lid{position:absolute;inset:8% 0 auto;height:22%;border-radius:10px;background:var(--bc);border:4px solid rgba(0,0,0,.28);filter:brightness(1.08);
  background-image:linear-gradient(90deg,transparent 44%,rgba(255,255,255,.85) 44% 56%,transparent 56%);transform-origin:50% 100%;transition:transform .5s cubic-bezier(.5,-.4,.4,1.4)}
.box .pic{position:absolute;inset:0;display:none}
.box .pic img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.box.useImg .body,.box.useImg .lid{display:none}
.box.useImg .pic{display:block}
.box .no{position:absolute;inset:22% 4% 0;display:grid;place-items:center;font-family:var(--eng);font-weight:700;font-size:clamp(40px,6vw,78px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.45)}
.box.useImg .no{inset:auto auto 4% 50%;transform:translateX(-50%);width:clamp(46px,5vw,64px);height:clamp(46px,5vw,64px);border-radius:50%;background:var(--bc);border:4px solid #fff;font-size:clamp(24px,3vw,36px)}
.box .prz{position:absolute;inset:10% 15% 18%;display:none;place-items:center;font-size:clamp(46px,7vw,90px)}
.box .prz img{max-width:100%;max-height:100%;object-fit:contain;border-radius:18px}
.box.open .prz{display:grid}
.box.open .no{display:none}
.box:not([disabled]):hover .lid{transform:translateY(-6px) rotate(-3deg)}
.box:not([disabled]){animation:wobble 2.6s ease-in-out infinite}
.box:nth-child(2){animation-delay:.3s}.box:nth-child(3){animation-delay:.6s}.box:nth-child(4){animation-delay:.9s}.box:nth-child(5){animation-delay:1.2s}.box:nth-child(6){animation-delay:1.5s}
@keyframes wobble{0%,48%,60%,100%{transform:rotate(0)}52%{transform:rotate(-2deg)}56%{transform:rotate(2deg)}}
.box.open .lid{transform:translateY(-60%) rotate(-24deg)}
.box.peek{opacity:.5;filter:saturate(.4)}
.box .lbl{position:absolute;left:0;right:0;bottom:-8px;font-family:var(--display);font-size:clamp(14px,1.6vw,20px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.prize{background:var(--cream);color:var(--ink);border-radius:24px;padding:16px 28px;text-align:center;border:4px solid var(--butter);box-shadow:0 8px 0 #b07a1c;
  animation:popIn .45s cubic-bezier(.3,1.6,.5,1);display:flex;align-items:center;gap:18px}
.prize .pi{font-size:64px;line-height:1;width:110px;height:110px;display:grid;place-items:center;flex:none}
.prize .pi img{width:100%;height:100%;object-fit:contain;border-radius:16px}
.prize .pt{font-family:var(--display);font-size:clamp(30px,4vw,48px)}
.prize .pd{font-family:var(--display);font-size:20px;color:#8a3d18}
@keyframes popIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.pickRow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.pickBtn{position:relative;font-family:var(--display);font-size:clamp(16px,1.8vw,22px);padding:10px 16px;border-radius:18px;border:4px solid rgba(0,0,0,.3);background:var(--c);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.pickBtn span{font-family:var(--eng);font-weight:700;margin-left:8px}
.pickBtn.me{outline:4px dashed var(--butter);outline-offset:3px}
.pickBtn.hit{transform:scale(1.14);box-shadow:0 0 0 5px #fff,0 0 30px 8px rgba(255,212,92,.8)}
.pickBtn em{position:absolute;top:-22px;right:-8px;font-style:normal;font-family:var(--eng);font-weight:700;font-size:22px;color:var(--butter);background:#5a2d14;padding:0 10px;border-radius:999px}

/* 끝 */
.podium{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:14px;width:100%}
.pod{width:min(170px,44vw);text-align:center}
.pod .bread{background:var(--c);border-radius:50% 50% 16px 16px/40% 40% 16px 16px;padding:16px 8px;border:4px solid rgba(0,0,0,.25);box-shadow:0 6px 0 rgba(0,0,0,.3)}
.pod .rank{font-family:var(--display);font-size:28px;color:var(--butter);text-shadow:0 3px 0 #5a2d14}
.pod .trophy{width:120px;margin:0 auto 6px}
.pod .nm{font-family:var(--display);font-size:20px}
.pod .sc{font-family:var(--eng);font-weight:700;font-size:44px;line-height:1}
.pod.first .bread{padding-block:34px;box-shadow:0 0 0 5px var(--butter),0 0 40px rgba(255,212,92,.7)}

/* 오프닝 영상 */
#introLayer{background:#000}
#introLayer video{max-width:100%;max-height:82vh;border-radius:18px}

.sprinkle{position:fixed;top:-20px;width:10px;height:22px;border-radius:6px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:760px){.opts{grid-template-columns:1fr}.teams{grid-template-columns:repeat(3,minmax(0,1fr))}.boxes{grid-template-columns:repeat(2,minmax(0,1fr))}.qMain{flex-direction:column}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bgLayer"></div>
<div class="lights" aria-hidden="true"></div>

<section class="screen" id="setup">
  <div id="setupLogo"><div class="sign"><h1>브레드의 <span class="pink">기분 빵 상자</span></h1><p>3학년 영어 · Lesson 8 I'm Happy · 2차시 (교과서 96~97쪽)</p></div></div>
  <div class="panel">
    <h2>몇 모둠이 빵집에 왔나요?</h2>
    <div class="countRow" id="countRow" role="group" aria-label="모둠 수"></div>
    <div class="names" id="names"></div>
    <ul class="rules">
      <li><b>① 문제 풀기</b>차례인 모둠이 화면을 보고 함께 답을 외쳐요. 선생님이 그 답을 눌러요.</li>
      <li><b>② 빵 상자 고르기</b>맞히면 빵 상자를 하나 골라요. 점수는 자동으로 바뀌어요!</li>
      <li><b>③ 다음 모둠</b>틀리면 다음 모둠 차례. 점수 옆 +, − 로 선생님이 고칠 수 있어요.</li>

const IMG={},AUD={};
function probe(name){if(IMG[name])return IMG[name];
  return IMG[name]=new Promise(res=>{let i=0;const t=()=>{if(i>=EXT_I.length)return res(null);const u=A+name+'.'+EXT_I[i++];const im=new Image();im.onload=()=>res(u);im.onerror=t;im.src=u};t();});}
function probeA(name){if(AUD[name])return AUD[name];
  return AUD[name]=new Promise(res=>{let i=0;const t=()=>{if(i>=EXT_A.length)return res(null);const u=A+name+'.'+EXT_A[i++];const a=new Audio();
    const ok=()=>{off();res(u)},bad=()=>{off();t()};const off=()=>{a.removeEventListener('canplay',ok);a.removeEventListener('error',bad)};
    a.addEventListener('canplay',ok);a.addEventListener('error',bad);a.preload='auto';a.src=u;a.load()};t();});}
function art(el,name,onOk){probe(name).then(u=>{if(!u)return;el.innerHTML=`<img src="${u}" alt="">`;el.classList.add('hasImg');el.hidden=false;onOk&&onOk(u)})}

/* ---------- 소리 ---------- */
let soundOn=true,musicOn=true,bgm=null,bgmName=null,ac=null;
function tone(seq){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;
  seq.forEach(([f,d,type])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'triangle';o.frequency.value=f;
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
   o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05);t+=d*.85;});}catch(e){}}
const FALLBACK={
 sfx_click:()=>tone([[900,.05]]),
 sfx_correct:()=>tone([[660,.14],[880,.14],[1320,.3]]),
 sfx_wrong:()=>tone([[300,.2,'sawtooth'],[220,.35,'sawtooth']]),
 sfx_box_open:()=>tone([[520,.1],[780,.1],[1040,.1],[1560,.3]]),
 sfx_good:()=>tone([[784,.12],[988,.12],[1175,.25]]),
 sfx_bad:()=>tone([[400,.15,'square'],[300,.15,'square'],[200,.3,'square']]),
 sfx_swap:()=>tone([[500,.08],[700,.08],[500,.08],[700,.15]]),
 sfx_roulette:()=>tone([[1000,.04]]),
 sfx_fanfare:()=>tone([[523,.15],[659,.15],[784,.15],[1047,.5]]),
 sfx_turn:()=>tone([[600,.08],[800,.12]])
};
async function sfx(name){if(!soundOn)return;const u=await probeA(name);
  if(u){const a=new Audio(u);a.volume=.9;a.play().catch(()=>{})}else FALLBACK[name]&&FALLBACK[name]();}
async function playBgm(name){if(bgmName===name&&bgm&&!bgm.paused)return;bgmName=name;
  if(bgm){bgm.pause();bgm=null}if(!musicOn)return;const u=(await probeA(name))||(name==='bgm_game'?await probeA('bgm_lobby'):null);if(!u||bgmName!==name)return;
  bgm=new Audio(u);bgm.loop=true;bgm.volume=.3;bgm.play().catch(()=>{});}
function duck(on){if(bgm)bgm.volume=on?.08:.3}
async function speakQ(text){duck(true);const f=VOICE[text];const u=f?await probeA(f):null;
  if(u){const a=new Audio(u);a.onended=()=>duck(false);a.play().catch(()=>duck(false));return;}
  try{speechSynthesis.cancel();const ut=new SpeechSynthesisUtterance(text);ut.lang='en-US';ut.rate=.8;
    const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)ut.voice=v;ut.onend=()=>duck(false);speechSynthesis.speak(ut)}catch(e){duck(false)}}
document.getElementById('musicBtn').onclick=()=>{musicOn=!musicOn;document.getElementById('musicBtn').textContent=musicOn?'음악 끄기':'음악 켜기';
  if(!musicOn&&bgm){bgm.pause();bgm=null}else{const n=bgmName;bgmName=null;playBgm(n||'bgm_game')}};

function sprinkle(n=60){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cs=['#ff5d8f','#ffd45c','#2fbf83','#4f7fe0','#fff5df','#c99af0'];
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='sprinkle';d.style.left=Math.random()*100+'vw';
   d.style.background=cs[i%cs.length];d.style.animationDuration=(1.4+Math.random()*1.6)+'s';d.style.animationDelay=(Math.random()*.4)+'s';
   document.body.appendChild(d);setTimeout(()=>d.remove(),3600);}}

function closeIntro(){const v=$('introVideo');v.pause();$('introLayer').hidden=true;
  const f=afterIntro;afterIntro=null;if(f)f();else if(bgm&&musicOn)bgm.play().catch(()=>{})}
$('introSkip').onclick=closeIntro;$('introVideo').onended=closeIntro;

/* ---------- 설정 ---------- */
function renderSetup(){
  const cr=$('countRow');cr.innerHTML='';
  for(let i=1;i<=6;i++){const b=document.createElement('button');b.className='countBtn';b.id='cnt'+i;b.textContent=i;
    b.setAttribute('aria-pressed',i===S.n);b.onclick=()=>{S.n=i;sfx('sfx_click');renderSetup()};cr.appendChild(b);}
  const nm=$('names');nm.innerHTML='';
  for(let i=0;i<S.n;i++){const l=document.createElement('label');l.style.setProperty('--c',TEAM_COLORS[i]);
    l.innerHTML=`<span class="dot" id="dot${i}"></span><input id="tn${i}" maxlength="10" value="${esc(S.names[i])}" aria-label="${i+1}모둠 이름">`;
    l.querySelector('input').oninput=e=>{S.names[i]=e.target.value||TEAM_DEFAULT[i]};nm.appendChild(l);art(l.querySelector('.dot'),'team_'+(i+1));}
  const old=load();$('resumeBtn').hidden=!(old&&old.qCount>0);
}
$('startBtn').onclick=()=>{for(let i=0;i<S.n;i++){const v=$('tn'+i).value.trim();S.names[i]=v||TEAM_DEFAULT[i];}
  S.scores=[0,0,0,0,0,0];S.turn=0;S.deck=[];S.qCount=0;S.cur=null;S.curDone=false;
  const go=()=>{sfx('sfx_fanfare');startGame()};if(introReady)playIntro(go);else go();};
$('resumeBtn').onclick=()=>{const o=load();if(o){S=o;startGame(true)}};
document.addEventListener('pointerdown',function first(){document.removeEventListener('pointerdown',first);if(!$('setup').hidden)playBgm('bgm_lobby')});

/* ---------- 게임 ---------- */
function startGame(resume){show('game');renderTeams();if(resume&&S.cur!=null&&!S.curDone)drawQuestion(S.cur);else nextQuestion();}
function renderTeams(pops){
  const t=$('teams');t.style.setProperty('--n',S.n);t.innerHTML='';
  for(let i=0;i<S.n;i++){const d=document.createElement('div');d.className='team'+(i===S.turn?' now':'');d.style.setProperty('--c',TEAM_COLORS[i]);
    d.innerHTML=`<div class="tok" hidden></div><div class="tName">${i+1}. ${esc(S.names[i])}</div><div class="tScore">${S.scores[i]}</div>
      <div class="adj"><button aria-label="${i+1}모둠 1점 빼기" data-i="${i}" data-d="-1">−</button><button aria-label="${i+1}모둠 1점 더하기" data-i="${i}" data-d="1">+</button></div>`;
    art(d.querySelector('.tok'),'team_'+(i+1));
    d.addEventListener('dblclick',()=>{S.turn=i;save();renderTeams()});
    if(pops&&pops[i]){const p=document.createElement('div');p.className='pop';p.textContent=pops[i];d.appendChild(p);}
    t.appendChild(d);}
  t.querySelectorAll('.adj button').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.i,dd=+b.dataset.d;
    S.scores[i]=Math.max(0,S.scores[i]+dd);save();sfx('sfx_click');renderTeams({[i]:dd>0?'+1':'−1'})});
}
function nextQuestion(){if(!S.deck.length)S.deck=shuffle(Q.map((_,i)=>i));S.cur=S.deck.pop();S.curDone=false;S.qCount++;save();drawQuestion(S.cur);}
function drawQuestion(qi){
  answered=false;const [cat,prompt,vis,say,ans,...wr]=Q[qi];const C=CAT[cat];
  $('qTag').textContent=C.t;$('qTag').style.setProperty('--c',C.c);$('qNo').textContent=`주문서 ${S.qCount}번`;
  const h=$('host');h.hidden=true;h.innerHTML='';art(h,C.host);
  $('prompt').innerHTML=prompt;
  const v=$('visual');v.className='visual';
  if(vis.includes('×')){const [e,n]=vis.split('×');v.classList.add('count');v.innerHTML=Array(+n).fill(`<span>${e}</span>`).join('');}
  else if(vis[0]==='#'){v.classList.add('word');v.textContent=vis.slice(1);}
  else if(vis[0]==='@'){v.classList.add('word');v.textContent=vis.slice(1);}
  else if(cat==='spell'){v.classList.add('spell');v.textContent=vis;}
  else v.textContent=vis;
  $('listenBtn').hidden=!say;$('said').hidden=true;$('said').textContent=say;
  if(say){$('listenBtn').onclick=()=>speakQ(say);setTimeout(()=>speakQ(say),400);}
  opts=shuffle([ans,...wr]);
  const box=$('opts');box.className='opts';box.innerHTML='';
  opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.id='opt'+i;b.style.setProperty('--kc',KEY_COLORS[i]);
    const cls=/^\p{Extended_Pictographic}/u.test(o)?' emo':/[가-힣]/.test(o)?' ko':'';
    b.innerHTML=`<span class="k">${'ABCD'[i]}</span><span class="v${cls}">${esc(o)}</span>`;b.onclick=()=>choose(i);box.appendChild(b);});
  $('verdict').textContent='';$('verdict').className='verdict';$('react').hidden=true;$('react').innerHTML='';
  $('qFoot').innerHTML='';
  const skip=document.createElement('button');skip.className='small';skip.textContent='문제 바꾸기';skip.onclick=()=>{S.qCount--;nextQuestion()};
  const reveal=document.createElement('button');reveal.className='small';reveal.textContent='정답 보여 주기';reveal.onclick=()=>finishWrong(-1);
  $('qFoot').append(skip,reveal);
}
function markAnswer(){const ans=Q[S.cur][4];opts.forEach((o,i)=>$('opt'+i).classList.add(o===ans?'right':'dim'));
  $('opts').classList.add('locked');if(Q[S.cur][3])$('said').hidden=false;}
function choose(i){if(answered)return;answered=true;
  if(opts[i]===Q[S.cur][4]){markAnswer();$('opt'+i).classList.remove('dim');
    $('verdict').textContent='딩동댕! 정답이에요!';$('verdict').className='verdict good';sfx('sfx_correct');sprinkle(50);art($('react'),'react_correct');
    S.curDone=true;save();$('qFoot').innerHTML='';
    const g=document.createElement('button');g.className='go';g.textContent='빵 상자 고르러 가기 →';g.onclick=openBoxes;$('qFoot').append(g);
  }else finishWrong(i);}
function finishWrong(i){answered=true;markAnswer();
  if(i>=0){const b=$('opt'+i);b.classList.remove('dim');b.classList.add('wrong');sfx('sfx_wrong');art($('react'),'react_wrong');
    $('verdict').textContent='아쉬워요! 정답은 초록색이에요.';}else $('verdict').textContent='정답은 초록색이에요.';
  $('verdict').className='verdict bad';S.curDone=true;save();$('qFoot').innerHTML='';
  const g=document.createElement('button');g.className='go mint';g.textContent='다음 모둠 차례 →';g.onclick=()=>{advance();nextQuestion()};$('qFoot').append(g);}
function advance(){S.turn=(S.turn+1)%S.n;save();renderTeams();sfx('sfx_turn');}
$('nextTeamBtn').onclick=()=>{advance();if(answered)nextQuestion();};

/* ---------- 빵 상자 ---------- */
function pickPrize(){const tot=PRIZES.reduce((a,p)=>a+p.w,0);let r=Math.random()*tot;for(const p of PRIZES){if((r-=p.w)<0)return p}return PRIZES[0]}
function prizeArt(el,p){el.textContent=p.ic;art(el,'prize_'+p.k);}
function openBoxes(){
  boxDone=false;boxSet=Array.from({length:6},pickPrize);
  if(S.n===1)boxSet=boxSet.map(p=>['steal','stealTop','swap','swapTop','swapLow','all'].includes(p.k)?PRIZES[0]:p);
  $('boxTitle').textContent=`${S.names[S.turn]}, 빵 상자를 하나 골라요!`;$('boxSub').textContent='맛있는 빵일까, 탄 빵일까?';$('boxSub').hidden=false;
  const bx=$('boxes');bx.innerHTML='';
  boxSet.forEach((p,i)=>{const b=document.createElement('button');b.className='box';b.id='box'+i;b.style.setProperty('--bc',BOX_COLORS[i]);b.setAttribute('aria-label',`${i+1}번 상자`);
    b.innerHTML=`<div class="body"></div><div class="lid"></div><div class="pic"></div><div class="no">${i+1}</div><div class="prz"></div><div class="lbl"></div>`;
    b.onclick=()=>pickBox(i);bx.appendChild(b);
    probe('box_closed').then(u=>{if(u){b.classList.add('useImg');b.querySelector('.pic').innerHTML=`<img src="${u}" alt="">`}});});
  $('prizeArea').innerHTML='';
  probe('bg_box').then(u=>{const L=$('boxLayer');if(u){L.style.backgroundImage=`url("${u}")`;L.classList.add('img')}});
  $('boxLayer').hidden=false;sfx('sfx_turn');
}
function revealBox(b,p){b.classList.add('open');prizeArt(b.querySelector('.prz'),p);b.querySelector('.lbl').textContent=p.t;
  probe('box_open').then(u=>{if(u&&b.classList.contains('useImg'))b.querySelector('.pic').innerHTML=`<img src="${u}" alt="">`});}
function pickBox(i){if(boxDone)return;boxDone=true;const p=boxSet[i];sfx('sfx_box_open');
  document.querySelectorAll('.box').forEach((b,j)=>{b.disabled=true;if(j===i)revealBox(b,p)});
  setTimeout(()=>{
    document.querySelectorAll('.box').forEach((b,j)=>{if(j!==i){b.classList.add('peek');revealBox(b,boxSet[j])}});
    $('boxSub').hidden=true;
    const pa=$('prizeArea');pa.innerHTML=`<div class="prize"><div class="pi" id="prizeIc"></div><div><div class="pt">${p.t}</div><div class="pd">${p.d}</div></div></div>`;
    prizeArt($('prizeIc'),p);applyPrize(p);
  },700);
}
function nextBtn(label,fn,cls){const g=document.createElement('button');g.className='go'+(cls?' '+cls:'');g.textContent=label;g.onclick=fn;$('prizeArea').append(g)}
function closeBoxes(again){$('boxLayer').hidden=true;if(!again)advance();else renderTeams();nextQuestion();}
const GOOD=['p1','p2','p3','x2','all','again','steal','stealTop'];
function applyPrize(p){
  const me=S.turn,pops={};
  const done=shown=>{save();renderTeams(pops);if(!shown&&S.n>1)$('prizeArea').append(miniBoard(pops));
    nextBtn(p.k==='again'?'한 문제 더 풀기 →':'다음 모둠 차례 →',()=>closeBoxes(p.k==='again'),'mint')};
  const good=n=>{sfx('sfx_good');sprinkle(n)};
  switch(p.k){
    case 'p1':S.scores[me]+=1;pops[me]='+1';good(30);done();break;
    case 'p2':S.scores[me]+=2;pops[me]='+2';good(45);done();break;
    case 'p3':S.scores[me]+=3;pops[me]='+3';good(80);done();break;
    case 'x2':{const add=Math.max(1,S.scores[me]);S.scores[me]+=add;pops[me]='+'+add;good(70);done();break;}
    case 'all':for(let i=0;i<S.n;i++){S.scores[i]+=1;pops[i]='+1'}good(60);done();break;
    case 'm1':if(S.scores[me]>0){S.scores[me]-=1;pops[me]='−1'}sfx('sfx_bad');done();break;
    case 'zero':sfx('sfx_bad');done();break;
    case 'again':good(30);done();break;
    default:autoTarget(p,done,pops);
  }
}
function miniBoard(pops,hi){
  const row=document.createElement('div');row.className='pickRow';
  for(let i=0;i<S.n;i++){const b=document.createElement('div');b.className='pickBtn'+(i===S.turn?' me':'')+(i===hi?' hit':'');
    b.id='mb'+i;b.style.setProperty('--c',TEAM_COLORS[i]);
    b.innerHTML=`${esc(S.names[i])}<span>${S.scores[i]}점</span>`+(pops&&pops[i]?`<em>${pops[i]}</em>`:'');row.append(b);}
  return row;
}
function others(){return [...Array(S.n).keys()].filter(i=>i!==S.turn)}
function findTarget(k){
  const me=S.turn,o=others();if(!o.length)return -1;const rnd=a=>a[Math.floor(Math.random()*a.length)];
  if(k==='steal'){const has=o.filter(i=>S.scores[i]>0);return has.length?rnd(has):-1;}
  if(k==='swap')return rnd(o);
  if(k==='stealTop'){const mx=Math.max(...o.map(i=>S.scores[i]));return mx>0?rnd(o.filter(i=>S.scores[i]===mx)):-1;}
  if(k==='swapTop'){const mx=Math.max(...o.map(i=>S.scores[i]));return mx>S.scores[me]?rnd(o.filter(i=>S.scores[i]===mx)):-1;}
  if(k==='swapLow'){const mn=Math.min(...o.map(i=>S.scores[i]));return mn<S.scores[me]?rnd(o.filter(i=>S.scores[i]===mn)):-1;}
  return -1;
}
function autoTarget(p,done,pops){
  const me=S.turn,pa=$('prizeArea'),t=findTarget(p.k);
  const msg=document.createElement('p');msg.className='ovSub';
  if(t<0){
    if(p.k==='swapLow'){msg.textContent='휴~ 우리가 이미 제일 낮아서 그대로예요!';pa.append(msg);done();return;}
    S.scores[me]+=1;pops[me]='+1';msg.textContent=p.k==='swapTop'?'우리가 이미 1등! 대신 +1점!':'가져올 빵이 없어서 대신 +1점!';
    pa.append(msg);sfx('sfx_good');sprinkle(30);done();return;}
  msg.textContent='두구두구… 어느 모둠일까?';
  const board=miniBoard();pa.append(msg,board);
  const cand=others(),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let step=0;const total=reduce?0:14+Math.floor(Math.random()*cand.length);
  const tick=()=>{const cur=cand[step%cand.length];
    board.querySelectorAll('.pickBtn').forEach(b=>b.classList.remove('hit'));board.querySelector('#mb'+cur).classList.add('hit');sfx('sfx_roulette');
    if(step>=total&&cur===t){setTimeout(finish,450);return;}step++;setTimeout(tick,50+step*7);};
  const finish=()=>{const nm=S.names[t];
    if(p.k==='steal'||p.k==='stealTop'){S.scores[t]-=1;S.scores[me]+=1;pops[t]='−1';pops[me]='+1';msg.textContent=`${nm}에게서 빵 1점을 가져왔어요!`;sfx('sfx_good');}
    else{const a=S.scores[me],b=S.scores[t];S.scores[me]=b;S.scores[t]=a;
      pops[me]=(b>=a?'+':'−')+Math.abs(b-a);pops[t]=(a>=b?'+':'−')+Math.abs(a-b);
      msg.textContent=`${nm}와(과) 점수가 바뀌었어요! (${a}점 ⇄ ${b}점)`;sfx('sfx_swap');}
    board.replaceWith(miniBoard(pops,t));if(S.scores[me]>=S.scores[t])sprinkle(50);done(true);};
  tick();
}

/* ---------- 끝 ---------- */
$('endBtn').onclick=()=>{
  const order=[...Array(S.n).keys()].sort((a,b)=>S.scores[b]-S.scores[a]);
  const pd=$('podium');pd.innerHTML='';let rank=0,prev=null;
  order.forEach((i,k)=>{if(S.scores[i]!==prev){rank=k+1;prev=S.scores[i]}
    const d=document.createElement('div');d.className='pod'+(rank===1?' first':'');d.style.setProperty('--c',TEAM_COLORS[i]);
    d.innerHTML=(rank===1?'<div class="trophy" hidden></div>':'')+`<div class="rank">${rank}등</div><div class="bread"><div class="nm">${esc(S.names[i])}</div><div class="sc">${S.scores[i]}</div></div>`;
    pd.append(d);const tr=d.querySelector('.trophy');if(tr)art(tr,'trophy');});
  show('end');sfx('sfx_fanfare');sprinkle(120);
};
$('backGameBtn').onclick=()=>{show('game');renderTeams()};
$('newGameBtn').onclick=()=>{try{localStorage.removeItem(SAVE)}catch(e){}show('setup');renderSetup()};
$('toSetupBtn').onclick=()=>{show('setup');renderSetup()};
document.addEventListener('keydown',e=>{
  if(!$('game').hidden&&$('boxLayer').hidden&&!answered&&['1','2','3','4'].includes(e.key))choose(+e.key-1);
  if(!$('boxLayer').hidden&&!boxDone&&['1','2','3','4','5','6'].includes(e.key))pickBox(+e.key-1);
});
try{speechSynthesis.getVoices()}catch(e){}
setBg('setup');renderSetup();
</script>
</body>
</html>
