<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토이랜드 장난감 공장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Jua&family=Gowun+Dodum&family=Fredoka:wght@500;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* 달밤 장난감 공장: 어두운 남보라 바탕 + 촛불 주황 + 꿰맨 천 테두리. 장면마다 배경 그림이 뒤에 깔림 */
:root{
  --night:#130F24; --panel:rgba(28,22,52,.9); --panel2:#2A2350; --line:#41377A;
  --moon:#EEE8FF; --fog:#ABA1D4; --candle:#FFA94D; --candled:#C9661B; --moss:#86CFA0; --mossd:#3E8C5C;
  --plum:#9C7BE8; --plumd:#6A4CC0; --sky:#7FA8FF; --skyd:#4B6FD0; --red:#D9291F;
  --parch:#F1E6CF; --parch2:#E2D2B0; --ink:#2B2140;
  /* 예전 이름 (아래 규칙과 호환) */
  --paper:var(--panel); --ink2:var(--fog); --pink:var(--candle); --pinkd:var(--candled); --mint:var(--moss); --mintd:var(--mossd);
  --butter:var(--candle); --butterd:var(--candled); --grape:var(--plum); --graped:var(--plumd);
  --dokdo:'East Sea Dokdo','Jua',cursive; --jua:'Jua','Gowun Dodum',sans-serif; --en:'Fredoka','Jua',sans-serif;
  --scene:none;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Gowun Dodum',sans-serif;color:var(--moon);background:var(--night);min-height:100vh;padding-bottom:70px;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(19,15,36,.55),rgba(19,15,36,.88) 60%,rgba(19,15,36,.96)),var(--scene) center/cover no-repeat;transition:background-image .6s}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--candle);outline-offset:2px}
.en{font-family:var(--en);font-weight:600;letter-spacing:.2px}

/* ---------- 머리줄 ---------- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;
  background:rgba(14,11,28,.92);backdrop-filter:blur(6px);border-bottom:2px dashed rgba(255,169,77,.35)}
.brand{font-family:var(--dokdo);font-size:30px;color:var(--candle);white-space:nowrap;line-height:1}
.belt{flex:1;display:flex;gap:10px;justify-content:center;min-width:260px}
.belt .rm{display:flex;align-items:center;gap:3px;background:var(--panel2);border-radius:999px;padding:3px 8px;border:1px solid var(--line)}
.belt .rm .ic{font-size:15px;margin-right:2px;filter:grayscale(1);opacity:.45}
.belt .rm.on .ic,.belt .rm.done .ic{filter:none;opacity:1}
.belt .rm.on{border-color:var(--candle)}
.belt .bx{width:12px;height:12px;border-radius:3px;background:#3A3166}
.belt .bx.f{background:#B98A5A;box-shadow:inset 0 -3px 0 #87603A}
.belt .bx.c{background:var(--candle);box-shadow:0 0 8px var(--candle);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.hd-right{display:flex;gap:6px;align-items:center}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--jua);font-size:15px;white-space:nowrap}
.tg{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 10px;font-family:var(--jua);font-size:14px}
.tg.off{opacity:.45}

main{max-width:980px;margin:18px auto;padding:0 16px}
.card{background:var(--panel);border-radius:26px;padding:26px;position:relative;border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.card::before{content:'';position:absolute;inset:8px;border:2px dashed rgba(238,232,255,.13);border-radius:20px;pointer-events:none}
h1,h2,h3{font-family:var(--jua);font-weight:400}
h2{font-size:28px;margin-bottom:8px}
p{line-height:1.7;font-size:18px}
b{color:var(--candle);font-weight:700}

/* 버튼 */
.btn{border:0;border-radius:16px;padding:12px 26px;font-family:var(--jua);font-size:21px;color:#2A1606;background:var(--candle);box-shadow:0 5px 0 var(--candled);transition:transform .1s;position:relative;z-index:1}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--candled)}
.btn.mint{background:var(--moss);box-shadow:0 5px 0 var(--mossd);color:#0E2A18}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--skyd);color:#0D1A3A}
.btn.grape{background:var(--plum);box-shadow:0 5px 0 var(--plumd);color:#fff}
.btn.ghost{background:var(--panel2);color:var(--moon);box-shadow:0 4px 0 #191433;border:1px solid var(--line);font-size:17px;padding:8px 16px}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.btn.big{font-size:24px;padding:14px 34px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.center{text-align:center}
.mt{margin-top:16px}

/* 장난감 얼굴 (사진) */
.toy{width:78px;height:78px;border-radius:50%;background:var(--panel2);position:relative;flex:none;animation:bob 2.6s ease-in-out infinite;
  border:3px solid #5A4C99;box-shadow:0 0 0 3px var(--night),0 6px 14px rgba(0,0,0,.5)}
.toy img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.toy.sm{width:54px;height:54px;border-width:2px}
.toy.lg{width:124px;height:124px;border-width:4px}
.toy .nm{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);background:var(--parch);color:var(--ink);border-radius:6px;padding:0 8px;font-family:var(--en);font-weight:600;font-size:13px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.toy.talk{animation:talk .35s ease-in-out infinite;border-color:var(--candle);box-shadow:0 0 0 3px var(--night),0 0 22px var(--candle)}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes talk{50%{transform:scale(1.08) rotate(-3deg)}}

/* 공장장 말 */
.boss{display:flex;gap:18px;align-items:flex-start;position:relative;z-index:1}
.boss .say{flex:1;background:var(--parch);color:var(--ink);border-radius:18px;padding:14px 18px;position:relative;font-size:19px;line-height:1.65;box-shadow:0 6px 0 var(--parch2)}
.boss .say b{color:#B4501A}
.boss .say:before{content:'';position:absolute;left:-16px;top:26px;border:10px solid transparent;border-right-color:var(--parch)}

/* ---------- 큰 그림 (장면) ---------- */
.shot{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/9;max-width:100%;background:#0B0918;box-shadow:0 10px 30px rgba(0,0,0,.5);margin-bottom:18px}
.shot>img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 18s ease-in-out infinite alternate}
.shot .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(10,8,20,.75))}
.shot .body{position:absolute;bottom:0;right:4%;height:92%;width:auto;border-radius:14px;box-shadow:0 0 0 4px var(--night);animation:none}
.shot .over{position:absolute;left:0;right:0;bottom:0;padding:18px 22px;background:linear-gradient(transparent,rgba(10,8,20,.85))}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translate(-1%,-1%)}}
.shot.shake{animation:shake .12s 6}

/* ---------- 시작 화면 ---------- */
.hero{text-align:center}
.hero .ttl{font-family:var(--dokdo);font-size:64px;color:var(--candle);line-height:.95;text-shadow:0 3px 0 #3A1C06,0 0 26px rgba(255,169,77,.45)}
.hero .sub{font-family:var(--en);font-size:19px;color:var(--moon);margin-top:6px;opacity:.9}
.namebox{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.namebox label{font-family:var(--jua);font-size:22px}
.namebox input{width:260px;font-family:var(--jua);font-size:24px;padding:10px 16px;border:2px solid var(--line);border-radius:14px;background:var(--parch);text-align:center;color:var(--ink)}
.namebox input:focus{outline:none;border-color:var(--candle)}
.namebox input.need{border-color:var(--red);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.nums{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.nums button{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 0;font-family:var(--jua);font-size:21px;box-shadow:0 3px 0 #191433}
.nums button:hover{border-color:var(--candle);color:var(--candle)}
.hint{font-family:var(--jua);font-size:17px;color:var(--fog);text-align:center;margin-top:12px}

/* ---------- 이야기 ---------- */
.story-text{font-size:20px;line-height:1.75;min-height:96px;position:relative;z-index:1}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--candle);box-shadow:0 0 8px var(--candle)}

/* ---------- 작업실 입구 ---------- */
.door .sign{position:absolute;left:50%;top:18px;transform:translateX(-50%) rotate(-2deg);font-family:var(--dokdo);font-size:44px;color:var(--ink);background:var(--parch);padding:4px 26px 0;border-radius:6px;box-shadow:0 6px 0 var(--parch2),0 10px 20px rgba(0,0,0,.5);white-space:nowrap}
.door .sign:before,.door .sign:after{content:'';position:absolute;top:-18px;width:2px;height:20px;background:#8A7A5A}
.door .sign:before{left:18px}.door .sign:after{right:18px}

/* ---------- 문제 공통 ---------- */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;position:relative;z-index:1}
.qnum{font-family:var(--jua);font-size:19px;color:var(--ink);border-radius:10px;padding:6px 14px;white-space:nowrap}
.qask{font-size:20px;line-height:1.5;font-weight:700}
.listenbar{display:flex;justify-content:center;margin:8px 0 14px;position:relative;z-index:1}
.opts{display:grid;gap:12px;margin-top:16px;position:relative;z-index:1}
.opts.pics{grid-template-columns:repeat(4,1fr)}
.opts.txt{grid-template-columns:1fr 1fr}
.opts.toys{grid-template-columns:repeat(4,1fr)}
.opt{background:var(--panel2);border:3px solid var(--line);border-radius:16px;padding:14px;font-size:20px;box-shadow:0 5px 0 #191433;transition:transform .12s,border-color .12s;position:relative}
.opt:hover{transform:translateY(-3px);border-color:#6A5CB0}
.opt.sel{border-color:var(--candle);box-shadow:0 5px 0 var(--candled),0 0 22px rgba(255,169,77,.45)}
.opt.sel:after{content:'✔';position:absolute;top:-12px;right:-10px;width:32px;height:32px;border-radius:50%;background:var(--candle);color:#2A1606;font-size:18px;display:grid;place-items:center;box-shadow:0 2px 0 var(--candled);z-index:2}
.opt.pic{padding:0;overflow:hidden}
.opt.pic img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.opt.pic .lbl{position:absolute;left:8px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--parch);color:var(--ink);display:grid;place-items:center;font-family:var(--jua);font-size:20px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.opt .lbl{font-family:var(--jua);font-size:26px;color:var(--fog)}
.opt.t{text-align:left;font-family:var(--en);font-weight:600;font-size:21px;display:flex;gap:10px;align-items:center}
.opt.t .lbl{font-size:22px;flex:none;color:var(--candle)}
.submit{display:flex;justify-content:center;margin-top:24px;position:relative;z-index:1}

/* 듣기 */
.speakers{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin:8px 0 4px;position:relative;z-index:1}
.spk{display:flex;flex-direction:column;align-items:center;gap:18px}
.spk .mute{background:var(--panel2);border-radius:14px;padding:6px 12px;font-size:20px;letter-spacing:3px;border:2px solid var(--line);min-width:64px;text-align:center}
.spk.talking .mute{border-color:var(--candle);color:var(--candle)}

/* 말풍선 */
.chat{display:flex;flex-direction:column;gap:20px;margin:6px 0;position:relative;z-index:1}
.ln{display:flex;gap:14px;align-items:center}
.ln.r{flex-direction:row-reverse}
.bub{background:var(--parch);color:var(--ink);border-radius:20px;padding:12px 18px;font-size:22px;position:relative;max-width:70%;display:flex;gap:10px;align-items:center;box-shadow:0 5px 0 var(--parch2)}
.bub .say-btn{border:0;background:#D8C9A6;border-radius:50%;width:34px;height:34px;flex:none;font-size:16px}
.bub.blank{border:3px dashed var(--candle);background:rgba(255,169,77,.08);color:var(--candle);min-width:240px;min-height:56px;box-shadow:none}
.bub.blank.filled{border-style:solid;background:var(--parch);color:var(--ink)}
.think{width:150px;border-radius:16px;overflow:hidden;position:relative;flex:none;border:3px solid var(--parch);box-shadow:0 6px 14px rgba(0,0,0,.5)}
.think img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.think:after{content:'💭';position:absolute;left:-2px;top:-4px;font-size:22px}

/* 이름표 (크라프트지 꼬리표) */
.tag{display:flex;gap:20px;align-items:center;background:linear-gradient(135deg,#D8BE8E,#C9AA74);color:var(--ink);border-radius:14px 40px 40px 14px;padding:18px 26px 18px 22px;position:relative;box-shadow:0 8px 0 #9C7F4E,0 14px 24px rgba(0,0,0,.45);z-index:1}
.tag:before{content:'';position:absolute;right:20px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--night);box-shadow:inset 0 0 0 4px #9C7F4E}
.tag .pic{flex:none;width:170px;border-radius:10px;overflow:hidden;border:3px solid var(--parch);box-shadow:0 4px 10px rgba(0,0,0,.35);background:var(--parch)}
.tag .pic img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.tag .pic.emo{display:grid;place-items:center;font-size:56px;aspect-ratio:4/3}
.tag .toy{animation:none}
.sent{font-family:var(--en);font-weight:600;font-size:28px;line-height:1.6;flex:1;min-width:0;padding-right:30px}
.slot{display:inline-block;min-width:150px;border-bottom:4px solid #B4501A;color:#9A3C0C;text-align:center;padding:0 6px;margin:0 4px}
.slot.empty{color:rgba(43,33,64,.35)}
.sent input{font-family:var(--en);font-weight:600;font-size:26px;width:170px;border:0;border-bottom:4px solid #B4501A;background:rgba(255,255,255,.35);border-radius:6px 6px 0 0;text-align:center;color:#9A3C0C;margin:0 6px}
.sent input:focus{outline:none;background:rgba(255,255,255,.6)}
.tag .sent[style]{color:rgba(43,33,64,.8)!important}

/* 조립 */
.tray{min-height:76px;background:rgba(134,207,160,.08);border:3px dashed var(--moss);border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;position:relative;z-index:1}
.tray .ph{color:var(--fog);font-family:var(--jua);font-size:17px}
.blocks{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px;min-height:62px;position:relative;z-index:1}
.blk{border:0;font-family:var(--en);font-weight:600;font-size:24px;padding:10px 16px;border-radius:10px;color:#1C1530;box-shadow:0 5px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.25);transition:transform .1s}
.blk:hover{transform:translateY(-2px) rotate(-2deg)}
.blk.c0{background:#E8A27C}.blk.c1{background:#8FB1F0}.blk.c2{background:#8CD1A4}.blk.c3{background:#F2C46B}.blk.c4{background:#B9A0F0}.blk.c5{background:#EE8C8C}.blk.c6{background:#7FCBD4}.blk.c7{background:#E3A6DA}

/* 수첩 */
.note{background:repeating-linear-gradient(180deg,var(--parch) 0 46px,#D9C9A4 46px 48px);color:var(--ink);border-radius:12px;padding:16px 20px 16px 58px;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.45);z-index:1}
.note:before{content:'';position:absolute;left:38px;top:0;bottom:0;width:2px;background:#C46A5A}
.note .rings{position:absolute;left:8px;top:16px;bottom:16px;display:flex;flex-direction:column;justify-content:space-around}
.note .rings i{width:18px;height:18px;border-radius:50%;background:var(--night);border:3px solid #8A7A5A}
.note h3{font-size:20px;margin-bottom:6px}
.nt{display:flex;gap:14px;align-items:center;height:48px;font-size:22px}
.nt .toy{animation:none;box-shadow:none}
.nt .who{font-family:var(--en);font-weight:600;width:110px}
.nt .what{font-family:var(--en);font-weight:600;color:#2F5BA8}
.bigq{font-family:var(--en);font-weight:600;font-size:28px;text-align:center;margin-top:18px;color:var(--candle);position:relative;z-index:1}
.opt.toycard{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 8px 20px}
.opt.toycard .toy{animation:none}

/* 포장 연출 */
#pack{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,8,20,.72);backdrop-filter:blur(3px);z-index:50}
#pack.show{display:grid}
.pk{text-align:center}
.pk .boxwrap{position:relative;width:200px;height:180px;margin:0 auto}
.pk .bx{position:absolute;bottom:0;left:20px;width:160px;height:108px;background:#A97C52;border-radius:8px;box-shadow:inset 0 -12px 0 #7E5933;background-image:repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.08) 30px 32px)}
.pk .bx:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:24px;transform:translateX(-50%);background:#7A4FA8;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.pk .lid{position:absolute;left:10px;width:180px;height:32px;background:#BD9064;border-radius:8px;top:-70px;animation:lid .6s .35s forwards;box-shadow:inset 0 -6px 0 #946A40}
.pk .item{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:86px;height:86px;border-radius:50%;overflow:hidden;border:3px solid var(--parch);animation:drop .4s forwards}
.pk .item img{width:100%;height:100%;object-fit:cover}
@keyframes drop{to{top:56px}}
@keyframes lid{to{top:34px}}
.pk .msg{font-family:var(--dokdo);font-size:46px;color:var(--candle);margin-top:14px;opacity:0;animation:fadeup .3s .8s forwards;text-shadow:0 0 18px rgba(255,169,77,.5)}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 작업 일지 (채점): 촛불 아래 낡은 종이 ---------- */
.paper{background:#F4ECDA;color:var(--ink);border-radius:4px;padding:28px 30px 34px;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 60px rgba(255,169,77,.15);position:relative;z-index:1;
  background-image:repeating-linear-gradient(180deg,transparent 0 41px,#DCCFB2 41px 43px);border-top:12px solid #7A4FA8}
.paper b{color:var(--ink)}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double var(--ink);padding-bottom:8px;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.paper .ph h2{font-family:var(--dokdo);font-size:44px;line-height:1}
.paper .ph .who{font-family:var(--jua);font-size:19px}
.paper .ph .who b{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink);text-align:center;font-weight:400}
.items{display:grid;grid-template-columns:1fr 1fr;gap:4px 26px}
.it{display:flex;gap:10px;align-items:flex-start;min-height:62px;padding:6px 0;position:relative}
.it .no{position:relative;width:38px;height:38px;flex:none;font-family:var(--jua);font-size:22px;display:grid;place-items:center}
.it .no svg{position:absolute;left:-14px;top:-12px;width:66px;height:62px;overflow:visible;pointer-events:none}
.it .no svg path{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300}
.it.mk .no svg path{animation:draw .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.it .body{flex:1;min-width:0}
.it .s{font-size:15px;color:#6B5E80}
.it .a{font-family:var(--en);font-weight:600;font-size:17px;word-break:break-word}
.it .fix{font-family:'Nanum Pen Script';color:var(--red);font-size:25px;line-height:1.05;opacity:0;transition:opacity .4s;transform:rotate(-2deg)}
.it.mk .fix{opacity:1}
.it .fx{position:absolute;left:-20px;top:-8px;font-size:19px;opacity:0;pointer-events:none}
.it.mk .fx{opacity:1}
.it.mk .fx.gear{animation:wind .7s ease-out}
.it.mk .fx.lock{animation:clunk .45s ease-out}
@keyframes wind{0%{transform:rotate(0) scale(.4)}60%{transform:rotate(540deg) scale(1.3)}100%{transform:rotate(720deg) scale(1)}}
@keyframes clunk{0%{transform:translateY(-14px) scale(1.4)}55%{transform:translateY(2px) rotate(-12deg)}75%{transform:rotate(10deg)}100%{transform:none}}
.scorebox{display:flex;align-items:center;justify-content:flex-end;gap:20px;margin-top:10px;min-height:120px;position:relative}
.score{font-family:'Nanum Pen Script';color:var(--red);font-size:96px;line-height:1;transform:rotate(-6deg);opacity:0;position:relative}
.score.show{animation:pop .45s forwards}
.score:after{content:'';position:absolute;left:0;right:0;bottom:6px;height:10px;border-top:3px solid var(--red);border-bottom:3px solid var(--red);transform:scaleX(0);transform-origin:left;transition:transform .4s .3s}
.score.show:after{transform:scaleX(1)}
@keyframes pop{0%{opacity:0;transform:rotate(-6deg) scale(2)}100%{opacity:1;transform:rotate(-6deg) scale(1)}}
.comment{font-family:'Nanum Pen Script';color:var(--red);font-size:34px;opacity:0;transition:opacity .5s}
.comment.show{opacity:1}
.stamp{width:120px;height:120px;border-radius:50%;border:6px double var(--red);color:var(--red);display:grid;place-items:center;text-align:center;font-family:var(--jua);font-size:21px;line-height:1.15;transform:rotate(-14deg) scale(2.4);opacity:0;background:rgba(255,255,255,.35)}
.stamp.show{animation:stampin .3s forwards}
@keyframes stampin{to{transform:rotate(-14deg) scale(1);opacity:.88}}
.grader{display:flex;gap:14px;align-items:center;margin-bottom:14px;position:relative;z-index:1}

/* 다시 보기 */
.rv{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;background:var(--panel2);position:relative;z-index:1}
.rv .q{font-weight:700;font-size:17px}
.rv .mine{font-family:var(--en);color:#F08A80;margin-top:4px}
.rv .right{font-family:var(--en);color:var(--moss);font-weight:700}
#extra{position:relative;z-index:1}

/* 바닥 컨베이어 */
.conv{position:fixed;left:0;right:0;bottom:0;height:42px;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(90deg,#3B2F55 0 24px,#4A3D68 24px 48px);border-top:4px solid #6B5A3E;animation:roll 1.4s linear infinite}
.conv span{position:absolute;bottom:36px;font-size:28px;animation:go 16s linear infinite}
@keyframes roll{to{background-position:48px 0}}
@keyframes go{from{left:100%}to{left:-10%}}

#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:var(--parch);color:var(--ink);font-family:var(--jua);font-size:18px;padding:10px 20px;border-radius:999px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
.tlink{position:fixed;right:10px;bottom:50px;z-index:6;font-family:var(--jua);font-size:13px;color:var(--fog);text-decoration:none;background:rgba(19,15,36,.8);padding:3px 10px;border-radius:999px}
.demo-flag{position:fixed;left:10px;bottom:50px;z-index:6;background:#4A3D68;font-family:var(--jua);font-size:13px;padding:3px 10px;border-radius:999px}

@media (prefers-reduced-motion:reduce){.shot>img,.toy,.conv,.conv span{animation:none}}
@media (max-width:760px){
  .opts.pics,.opts.toys{grid-template-columns:1fr 1fr}
  .opts.txt{grid-template-columns:1fr}
  .items{grid-template-columns:1fr}
  .nums{grid-template-columns:repeat(6,1fr)}
  .hero .ttl{font-size:44px}
  .belt{order:3;min-width:100%}
  .tag{flex-wrap:wrap}
  .door .sign{font-size:30px}
  .shot .body{height:80%}
}
</style>
</head>
<body>
<header>
  <div class="brand">🧸 토이랜드 장난감 공장</div>
  <div class="belt" id="belt"></div>
  <div class="hd-right">
    <span class="pill" id="who">이름</span>
    <button class="tg" id="musicBtn" title="배경음악">🎵</button>
    <button class="tg off" id="slowBtn" title="영어를 천천히">🐢</button>
  </div>
</header>
<main id="app"></main>
<div id="pack"><div class="pk"><div class="boxwrap"><div class="item" id="packItem">🧸</div><div class="bx"></div><div class="lid"></div></div><div class="msg">📦 포장 완료!</div></div></div>
<div class="conv"><span>🎁</span></div>
<div id="toast"></div>
<a class="tlink" href="teacher.html">👩‍🏫 교사용</a>
<script src="common.js?v=4"></script>
<script>
/* ===================== 상태 ===================== */
const KEY = 'tf_student';
const fresh = () => ({ num: 0, name: '', sid: undefined, phase: 'story', qi: 0, roomSeen: -1, ans: {}, graded: false, finished: false });
let S = load();
function load() { try { return Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return fresh(); } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = s => document.querySelector(s);
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1900); }
function toyHTML(id, cls = '', withName = true) {
  const t = TOYS[id];
  return `<div class="toy ${cls}" data-toy="${id}"><img src="${IMG}${t.img}.jpg" alt="${esc(t.en)}" draggable="false">${withName ? `<span class="nm">${esc(t.en)}</span>` : ''}</div>`;
}
/* 장면마다 뒤에 까는 배경 그림 */
function setScene(name) { document.body.style.setProperty('--scene', name ? `url(${IMG}${name}.jpg)` : 'none'); }
function shot(name, extra = '', cls = '') { return `<div class="shot ${cls}"><img src="${IMG}${name}.jpg" alt="">${extra}<div class="vig"></div></div>`; }
let playToken = 0;
async function playLines(lines, root) {
  const my = ++playToken;
  Voice.stop();
  for (let k = 0; k < lines.length; k++) {
    const [who, text] = lines[k];
    if (my !== playToken) return;
    const el = root && root.querySelector(`[data-line="${k}"]`);
    root && root.querySelectorAll('.talking,.talk').forEach(e => e.classList.remove('talking', 'talk'));
    if (el) { el.classList.add('talking'); const ty = el.querySelector('.toy'); ty && ty.classList.add('talk'); }
    await sayAs(who, text);
    await sleep(250);
  }
  root && root.querySelectorAll('.talking,.talk').forEach(e => e.classList.remove('talking', 'talk'));
}
function stopAll() { playToken++; Voice.stop(); }

/* 서버 답장에서 '새 수업' 신호 확인 (선생님이 기록 초기화) */
SendQueue.onReply = r => {
  if (!r || !r.sid || !S.num) return;
  if (S.sid === undefined) { S.sid = r.sid; save(); return; }
  if (S.sid !== r.sid) { SendQueue.clear(); S = fresh(); save(); stopAll(); render(); toast('새 수업이 시작됐어요. 이름과 번호를 다시 입력해요!'); }
};

/* ===================== 머리줄 ===================== */
function renderHeader() {
  $('#who').textContent = S.num ? `${S.num}번 ${S.name}` : '이름';
  const cur = S.num && S.phase === 'play' ? S.qi : -1;
  $('#belt').innerHTML = ROOMS.map((r, ri) => {
    const qs = Q.map((q, i) => i).filter(i => Q[i].room === ri);
    const on = cur >= 0 && Q[Math.min(cur, 19)].room === ri && cur < 20;
    const done = qs.every(i => i < S.qi);
    return `<span class="rm ${on ? 'on' : ''} ${done ? 'done' : ''}" title="${r.name}"><span class="ic">${r.icon}</span>${qs.map(i => `<i class="bx ${i < S.qi ? 'f' : (i === cur ? 'c' : '')}"></i>`).join('')}</span>`;
  }).join('');
  $('#musicBtn').classList.toggle('off', !Music.on);
  $('#slowBtn').classList.toggle('off', !Voice.slow);
}

/* ===================== 화면 고르기 ===================== */
function render() {
  stopAll();
  renderHeader();
  const el = $('#app');
  window.scrollTo(0, 0);
  if (!S.num) return startScreen(el);
  if (S.phase === 'story') return storyScreen(el);
  if (S.qi >= Q.length) return gradeScreen(el);
  const q = Q[S.qi];
  if (S.roomSeen < q.room) return roomScreen(el, q.room);
  return questionScreen(el, q);
}

/* ===================== 시작 ===================== */
function cleanName(v) { return String(v || '').replace(/\s+/g, ' ').trim().slice(0, 12); }
function startScreen(el) {
  setScene('bg_title');
  el.innerHTML = `<div class="card">
    ${shot('bg_title', `<div class="over hero"><div class="ttl">토이랜드 장난감 공장의<br>뒤죽박죽 주말 계획!</div><div class="sub">What are you going to do this weekend?</div></div>`)}
    <p class="center mt">🎧 이어폰을 꽂고, <b>내 이름</b>을 쓴 다음 아래에서 <b>내 번호</b>를 눌러요.</p>
    <div class="namebox"><label for="nameIn">✏️ 내 이름</label><input id="nameIn" maxlength="12" autocomplete="off" placeholder="예) 김하나"></div>
    <div class="nums">${Array.from({ length: 40 }, (_, i) => `<button data-n="${i + 1}">${i + 1}</button>`).join('')}</div>
  </div>`;
  const inp = el.querySelector('#nameIn');
  el.querySelectorAll('.nums button').forEach(b => b.onclick = () => {
    const nm = cleanName(inp.value);
    if (!nm) { inp.classList.remove('need'); void inp.offsetWidth; inp.classList.add('need'); inp.focus(); toast('먼저 이름을 써 주세요! ✏️'); return; }
    const n = Number(b.dataset.n);
    if (!confirm(`${n}번 ${nm}, 맞나요?`)) return;
    S = fresh(); S.num = n; S.name = nm; save();
    SendQueue.clear();
    SendQueue.push({ action: 'join', num: n, name: nm });
    Sfx.play('room'); Music.start();
    render();
  });
}

/* ===================== 첫 이야기 ===================== */
const STORY = [
  { cls: '', img: 'bg_night',
    text: '금요일 밤, <b>토이랜드 장난감 공장</b>. 🌙<br>내일은 장난감 친구들이 신나는 <b>주말</b>을 보내러 집에 가는 날이에요.' },
  { cls: 'shake', img: 'bg_boom', boom: true,
    text: '그런데 <b>쾅!</b> ⚡ 장난감들의 <b>주말 계획 기계</b>가 고장 나 버렸어요!<br>계획표가 뒤죽박죽 섞여서 누가 무엇을 할지 아무도 몰라요. 😱' },
  { cls: '', img: 'bg_title', body: 'boss_body', who: 'boss', en: "Hello! I'm Teddy, the factory boss. Welcome to the Toy Factory!",
    text: '<b>테디 공장장</b>: "새로 온 꼬마 직원, 반가워요! <b>작업실 다섯 곳</b>을 돌면서 장난감들의 주말 계획을 바로잡고 <b>상자 20개</b>를 포장해 줄래요?"' },
  { cls: '', img: 'bg_room3', body: 'boss_body', who: 'boss', en: "Let's go!",
    text: '"상자 하나에 <b>5점</b>, 다 하면 <b>100점</b>이에요. 포장을 다 마치면 내가 <b>작업 일지</b>를 빨간 펜으로 채점해 줄게요. 한 번 담은 상자는 다시 못 여니까 <b>천천히 잘 보고</b> 골라요!"' }
];
function storyScreen(el) {
  let i = 0;
  const show = () => {
    const s = STORY[i];
    setScene(s.img);
    el.innerHTML = `<div class="card">
      ${shot(s.img, s.body ? `<img class="body" src="${IMG}${s.body}.jpg" alt="테디 공장장">` : '', s.cls)}
      <div class="story-text">${s.text}</div>
      <div class="row mt" style="justify-content:space-between">
        <div>${s.en ? `<button class="btn ghost" data-a="hear">🔊 영어로 듣기</button>` : ''}</div>
        <button class="btn mint big" data-a="next">${i < STORY.length - 1 ? '다음 ▶' : '공장 들어가기 🏭'}</button>
      </div>
      <div class="dots">${STORY.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div></div>`;
    if (s.boom) Sfx.play('boom');
    if (s.en) { sayAs(s.who, s.en); el.querySelector('[data-a=hear]').onclick = () => { stopAll(); sayAs(s.who, s.en); }; }
    el.querySelector('[data-a=next]').onclick = () => {
      stopAll();
      if (i < STORY.length - 1) { i++; show(); }
      else { S.phase = 'play'; save(); render(); }
    };
  };
  show();
}

/* ===================== 작업실 입구 ===================== */
function roomScreen(el, ri) {
  const r = ROOMS[ri];
  setScene('bg_room' + (ri + 1));
  el.innerHTML = `<div class="card">
    <div class="door">${shot('bg_room' + (ri + 1), `<div class="sign">${r.icon} ${ri + 1}번 · ${r.name}</div>`)}</div>
    <div class="boss">${toyHTML('boss', 'lg')}<div class="say">${r.say}<div class="mt"><span class="en" style="color:#6B5E80">“${esc(r.hello)}”</span></div></div></div>
    <div class="submit"><button class="btn big" data-a="go">작업 시작! 🔧</button></div></div>`;
  Sfx.play('room');
  setTimeout(() => sayAs('boss', r.hello), 400);
  el.querySelector('[data-a=go]').onclick = () => { S.roomSeen = ri; save(); render(); };
}

/* ===================== 문제 화면 ===================== */
function questionScreen(el, q) {
  const r = ROOMS[q.room], idx = Q.indexOf(q);
  setScene('bg_room' + (q.room + 1));
  let pick = null;   // 학생이 고른 답
  const head = `<div class="qhead"><span class="qnum" style="background:${r.color}">${r.icon} 상자 ${idx + 1} / 20</span><div class="qask">${q.ask}</div></div>`;
  const optsHTML = () => {
    if (!q.opts) return '';
    const isPic = q.opts[0].plan, isToy = q.opts[0].toy;
    const cls = isPic ? 'pics' : isToy ? 'toys' : 'txt';
    return `<div class="opts ${cls}">${q.opts.map((o, i) => {
      if (o.plan) return `<button class="opt pic" data-i="${i}">${planImg(o.plan)}<span class="lbl">${'ABCD'[i]}</span></button>`;
      if (o.toy) return `<button class="opt toycard" data-i="${i}">${toyHTML(o.toy)}<span class="lbl">${'ABCD'[i]}</span></button>`;
      return `<button class="opt t" data-i="${i}"><span class="lbl">${'①②③④'[i]}</span><span>${esc(o.t)}</span></button>`;
    }).join('')}</div>`;
  };
  const sentence = (fillId) => `<div class="sent">${esc(q.before || '')} <span class="slot empty" id="${fillId}">?</span> ${esc(q.after || '')}</div>`;
  let body = '';

  if (q.kind === 'listen') {
    body = `<div class="speakers">${q.lines.map((l, i) => `<div class="spk" data-line="${i}">${toyHTML(l[0])}<div class="mute">🔊 ···</div></div>`).join('')}</div>
      <div class="listenbar"><button class="btn sky" data-a="play">🔊 다시 듣기</button></div>
      ${q.before ? `<div class="tag" style="margin-top:6px"><div class="pic"><img src="${IMG}penguins_body.jpg" alt="펭귄 삼총사"></div>${sentence('fill')}</div>` : ''}
      ${optsHTML()}`;
  } else if (q.kind === 'bubble') {
    body = `<div class="chat">${q.bubbles.map((b, i) => {
      const right = i % 2 === 1;
      const inner = b[1] === null
        ? `<div class="bub blank" id="fill">? 알맞은 문장을 골라요</div>${b[2] ? `<div class="think">${planImg(b[2])}</div>` : ''}`
        : `<div class="bub"><button class="say-btn" data-say="${i}">🔊</button><span class="en">${esc(b[1])}</span></div>`;
      return `<div class="ln ${right ? 'r' : ''}">${toyHTML(b[0])}${inner}</div>`;
    }).join('')}</div>${optsHTML()}`;
  } else if (q.kind === 'phrase') {
    body = `<div class="tag">${toyHTML(q.toy)}<div class="pic">${planImg(q.plan)}</div>
      ${q.wholeSentence ? `<div class="sent"><span class="slot empty" id="fill" style="min-width:300px">?</span></div>` : sentence('fill')}</div>${optsHTML()}`;
  } else if (q.kind === 'type') {
    body = `<div class="tag">${toyHTML(q.toy)}<div class="pic">${planImg(q.plan)}</div>
      <div class="sent">${esc(q.before)} <input id="typeIn" autocomplete="off" spellcheck="false" maxlength="20" placeholder="?">${esc(q.after)}</div></div>
      <p class="hint">⌨️ 빈칸을 눌러 영어 단어를 써요.</p>`;
  } else if (q.kind === 'order') {
    body = `<div class="tag">${toyHTML(q.toy)}${q.plan ? `<div class="pic">${planImg(q.plan)}</div>` : '<div class="pic emo">❓💬</div>'}
      <div style="flex:1"><div class="sent" style="font-size:20px;color:var(--ink2)">블록을 순서대로 눌러 문장을 만들어요. 잘못 놓은 블록은 다시 누르면 빠져요.</div></div></div>
      <div class="tray" id="tray"><span class="ph">여기에 블록이 쌓여요 ⬇️</span></div>
      <div class="blocks" id="blocks"></div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" data-a="clear">↺ 처음부터</button></div>`;
  } else if (q.kind === 'note') {
    body = `<div class="note"><div class="rings"><i></i><i></i><i></i><i></i></div><h3>📒 테디의 인터뷰 수첩 — 주말 계획</h3>
      ${q.note.map(n => `<div class="nt">${toyHTML(n[0], 'sm', false)}<span class="who">${TOYS[n[0]].en}</span><span class="what">${PLANS[n[1]].en}</span></div>`).join('')}</div>
      <div class="bigq">Q. ${esc(q.question)}</div>${optsHTML()}`;
  }
  el.innerHTML = `<div class="card">${head}${body}<div class="submit"><button class="btn mint big" data-a="ok" disabled>📦 상자에 담기</button></div></div>`;
  const okBtn = el.querySelector('[data-a=ok]');
  const setPick = v => { pick = v; okBtn.disabled = v === null || v === ''; };

  // 보기 고르기
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    el.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); Sfx.play('pick');
    const i = Number(b.dataset.i);
    setPick(i);
    const f = el.querySelector('#fill');
    if (f && q.opts[i].t) {
      f.textContent = q.opts[i].t; f.classList.remove('empty'); f.classList.add('filled');
      if (f.classList.contains('bub')) f.classList.add('en');
    }
  });
  // 듣기
  if (q.kind === 'listen') {
    const root = el.querySelector('.speakers');
    el.querySelector('[data-a=play]').onclick = () => playLines(q.lines, root);
    setTimeout(() => playLines(q.lines, root), 500);
  }
  if (q.kind === 'bubble') el.querySelectorAll('[data-say]').forEach(b => b.onclick = () => { stopAll(); const l = q.bubbles[Number(b.dataset.say)]; sayAs(l[0], l[1]); });
  // 직접 쓰기
  if (q.kind === 'type') {
    const inp = el.querySelector('#typeIn');
    inp.oninput = () => setPick(inp.value.trim());
    inp.onkeydown = e => { if (e.key === 'Enter' && !okBtn.disabled) okBtn.click(); };
    setTimeout(() => inp.focus(), 100);
  }
  // 블록 조립
  if (q.kind === 'order') {
    const order = shuffle(q.words.map((w, i) => i), S.num * 13 + idx * 7);
    const placed = [];
    const draw = () => {
      el.querySelector('#tray').innerHTML = placed.length ? placed.map(i => `<button class="blk c${i % 8}" data-p="${i}">${esc(q.words[i])}</button>`).join('') : '<span class="ph">여기에 블록이 쌓여요 ⬇️</span>';
      el.querySelector('#blocks').innerHTML = order.filter(i => !placed.includes(i)).map(i => `<button class="blk c${i % 8}" data-b="${i}">${esc(q.words[i])}</button>`).join('');
      el.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { placed.push(Number(b.dataset.b)); Sfx.play('pop'); draw(); });
      el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { placed.splice(placed.indexOf(Number(b.dataset.p)), 1); Sfx.play('back'); draw(); });
      setPick(placed.length === q.words.length ? placed.map(i => q.words[i]).join(' ') : null);
    };
    el.querySelector('[data-a=clear]').onclick = () => { placed.length = 0; draw(); };
    draw();
  }
  // 상자에 담기 (답 확정 — 정답 여부는 마지막에 공개)
  okBtn.onclick = () => {
    if (pick === null || pick === '') return;
    if (!confirm('이 답으로 상자를 포장할까요? 포장하면 다시 바꿀 수 없어요.')) return;
    stopAll();
    const ok = grade(q, pick);
    S.ans[q.id] = pick; S.qi = idx + 1; save();
    SendQueue.push({ action: 'answer', num: S.num, name: S.name, qid: q.id, qi: idx, ans: answerText(q, pick), ok });
    packAnim(q.toy || (q.lines && q.lines[1] && q.lines[1][0]) || (q.bubbles && q.bubbles[q.bubbles.length - 1][0]) || 'boss');
  };
}
function packAnim(toy) {
  const p = $('#pack');
  $('#packItem').innerHTML = `<img src="${IMG}${(TOYS[toy] || TOYS.boss).img}.jpg" alt="">`;
  p.querySelectorAll('.item,.lid,.msg').forEach(e => { e.style.animation = 'none'; void e.offsetWidth; e.style.animation = ''; });
  p.classList.add('show'); Sfx.play('box');
  setTimeout(() => { p.classList.remove('show'); render(); }, 1500);
}

/* ===================== 채점 (작업 일지) ===================== */
function results() { return Q.map(q => ({ q, a: S.ans[q.id], ok: grade(q, S.ans[q.id]) })); }
function comment(score) {
  if (score === 100) return ['완벽해요! 최고의 장난감 박사! 🏆', '참 잘했어요'];
  if (score >= 85) return ['정말 잘했어요! 👍', '참 잘했어요'];
  if (score >= 70) return ['잘했어요! 조금만 더! 😊', '잘했어요'];
  return ['힘내요! 다시 보면 쑥쑥 늘어요 💪', '노력했어요'];
}
const CIRCLE = 'M33 6 C 52 4, 62 18, 60 32 C 58 48, 42 58, 28 56 C 12 54, 4 42, 6 28 C 8 14, 22 6, 38 8';
const SLASH = 'M50 4 L 14 58';
function gradeScreen(el) {
  const R = results(), score = R.filter(x => x.ok).length * POINTS, wrong = R.filter(x => !x.ok);
  setScene('bg_room3');
  if (!S.finished) { S.finished = true; save(); SendQueue.push({ action: 'finish', num: S.num, name: S.name, score }); }
  const [msg, stampTxt] = comment(score);
  const animate = !S.graded;
  el.innerHTML = `<div class="card">
    <div class="grader">${toyHTML('boss', '', false)}<div class="qask">${animate ? '테디 공장장이 빨간 펜을 꺼냈어요... 슥슥! ✍️' : '테디 공장장의 채점 결과예요.'}</div></div>
    <div class="paper">
      <div class="ph"><h2>📋 장난감 포장 작업 일지</h2><div class="who">6학년 · <b>${S.num}</b>번 · 이름 <b>${esc(S.name)}</b></div></div>
      <div class="items">${R.map((x, i) => `<div class="it ${animate ? '' : 'mk'}" data-i="${i}">
        <span class="fx ${x.ok ? 'gear' : 'lock'}">${x.ok ? '⚙️' : '🔒'}</span><div class="no">${i + 1}<svg viewBox="0 0 66 62"><path d="${x.ok ? CIRCLE : SLASH}"/></svg></div>
        <div class="body"><div class="s">${ROOMS[x.q.room].icon} ${esc(x.q.short)}</div>
          <div class="a">${esc(answerText(x.q, x.a))}</div>
          ${x.ok ? '' : `<div class="fix">→ ${esc(correctText(x.q))}</div>`}</div></div>`).join('')}</div>
      <div class="scorebox"><div><div class="comment ${animate ? '' : 'show'}">${msg}</div></div>
        <div class="score ${animate ? '' : 'show'}">${score}점</div>
        <div class="stamp ${animate ? '' : 'show'}">${stampTxt.replace(' ', '<br>')}</div></div>
    </div>
    <div class="row mt" style="justify-content:center;gap:14px" id="after" ${animate ? 'hidden' : ''}>
      ${wrong.length ? `<button class="btn sky" data-a="review">🔍 틀린 문제 다시 보기 (${wrong.length}개)</button>` : ''}
      <button class="btn grape" data-a="parade">🚚 장난감 출발시키기</button>
    </div>
    <div id="extra"></div></div>`;
  const after = () => {
    el.querySelector('#after').hidden = false;
    const rv = el.querySelector('[data-a=review]');
    if (rv) rv.onclick = () => reviewList(el.querySelector('#extra'), wrong);
    el.querySelector('[data-a=parade]').onclick = () => parade(el.querySelector('#extra'), score);
  };
  if (!animate) return after();
  (async () => {
    Music.duck(true);
    await sleep(900);
    const items = el.querySelectorAll('.it');
    for (let i = 0; i < items.length; i++) {
      items[i].classList.add('mk');
      Sfx.play(R[i].ok ? 'windup' : 'lock');     // 맞으면 태엽이 드르륵 감기고, 틀리면 자물쇠가 철컥 잠겨요
      await sleep(R[i].ok ? 520 : 620);
    }
    await sleep(500);
    el.querySelector('.score').classList.add('show'); Sfx.play('pen');
    await sleep(700);
    el.querySelector('.comment').classList.add('show');
    await sleep(500);
    el.querySelector('.stamp').classList.add('show'); Sfx.play('stamp');
    await sleep(300);
    Sfx.play(score >= 70 ? 'fanfare' : 'sad');
    Music.duck(false);
    S.graded = true; save();
    after();
  })();
}
function reviewList(box, wrong) {
  box.innerHTML = `<h3 class="mt" style="font-size:24px">🔍 틀린 문제 다시 보기</h3>${wrong.map((x, k) => `<div class="rv">
    <div class="q">${Q.indexOf(x.q) + 1}. ${x.q.ask}</div>
    ${x.q.question ? `<div class="en">Q. ${esc(x.q.question)}</div>` : ''}
    <div class="mine">내 답: ${esc(answerText(x.q, x.a))}</div>
    <div>정답: <span class="right">${esc(correctText(x.q))}</span></div>
    ${x.q.lines ? `<button class="btn ghost mt" data-k="${k}">🔊 대화 다시 듣기</button>` : ''}</div>`).join('')}`;
  box.querySelectorAll('[data-k]').forEach(b => b.onclick = () => playLines(wrong[Number(b.dataset.k)].q.lines, null));
  box.scrollIntoView({ behavior: 'smooth' });
}
function parade(box, score) {
  setScene('bg_finale');
  box.innerHTML = `<div class="mt">${shot('bg_finale')}</div>
    <p class="center mt"><b>장난감 친구들이 모두 주말 계획을 찾아서 출발했어요!</b> 고마워요, 꼬마 공장 직원님! 🎉</p>
    <p class="center en" style="color:var(--fog)">“Thank you! Have a nice weekend!”</p>`;
  Sfx.play('fanfare');
  setTimeout(() => sayAs('boss', 'Thank you! Have a nice weekend!'), 600);
  box.scrollIntoView({ behavior: 'smooth' });
}

/* ===================== 시작 ===================== */
$('#who').onclick = () => {
  if (S.num && confirm('번호나 이름을 잘못 썼나요? 처음부터 다시 시작할까요?')) { SendQueue.clear(); S = fresh(); save(); render(); }
};
$('#who').style.cursor = 'pointer';
$('#musicBtn').onclick = () => { const on = Music.toggle(); renderHeader(); toast(on ? '🎵 음악을 켰어요' : '🔇 음악을 껐어요'); };
$('#slowBtn').onclick = () => { Voice.slow = !Voice.slow; renderHeader(); toast(Voice.slow ? '🐢 영어를 천천히 들려줄게요' : '🐇 보통 빠르기로 들려줄게요'); };
document.addEventListener('click', e => {
  Sfx.ac();
  if (S.num && Music.on) Music.start();
  if (e.target.closest('.btn,.tg,.nums button')) Sfx.play('click');
}, true);
if (DEMO) { const d = document.createElement('div'); d.className = 'demo-flag'; d.textContent = '데모 모드 (서버 연결 전)'; document.body.appendChild(d); }
preloadImages();
render();
SendQueue.flush();
/* 선생님이 '기록 초기화'를 하면 (다음 반) 이 크롬북도 처음 화면으로 */
setInterval(async () => { if (!S.num) return; try { SendQueue.onReply(await api({ action: 'state' })); } catch (e) {} }, 20000);
</script>
</body>
