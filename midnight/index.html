<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자정의 골동품 가게</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>:root{color-scheme:dark}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="group.css">
</head>
<body>
<div class="wrap" id="app"><p class="loading">가게 문을 찾는 중이에요…</p></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<a class="quicklink" href="teacher.html" target="_blank" rel="noopener">🔑 교사용 화면</a>
<script src="common.js"></script>
<script>
/* =====================================================================
 *  학생 화면 — 모둠을 고르고 각자 풀어요. 상자에서 나온 점수는 모둠 점수로 합산돼요.
 * ===================================================================== */
const app = document.getElementById('app');
const LS_ME = 'midnight-group.me';
let G = null;          // 서버 상태(모둠 수, 이름, 점수, 문 열림 등)
let SET = null;        // 오늘의 문제 세트
let S = null;          // 이 학생의 진행 상태
let deltas = {};       // 점수 바뀐 모둠 → 변화량 (애니메이션)
let lastFeedT = 0, joinMsg = '', busy = false;
const draft = { group: null, name: '' };

function saveMe() { if (S) lsSet(LS_ME, JSON.stringify(S)); }
function loadMe() { try { return JSON.parse(lsGet(LS_ME) || 'null'); } catch (e) { return null; } }

/* ---------- 문제 세트 ---------- */
async function loadSet() {
  if (!G || G.setId === 'default') { SET = DEFAULT_SET; return; }
  const key = 'midnight-group.set';
  try { const c = JSON.parse(lsGet(key) || 'null'); if (c && c.id === G.setId && c.ver === G.setVer) { SET = c; return; } } catch (e) {}
  try { const r = await api({ action: 'set' }, 3); if (r && r.set) { SET = r.set; lsSet(key, JSON.stringify(r.set)); return; } } catch (e) {}
  SET = DEFAULT_SET;
}
const pas = k => (SET.passages || []).find(x => x.id === k);
const Q = () => SET.questions[S.order[S.qi]];
const limit = () => { const n = S ? S.order.length : 0; return G && G.limit ? Math.min(G.limit, n) : n; };

/* ---------- 서버 상태 반영 ---------- */
function takeState(st, quiet) {
  if (!st || !st.ok || !st.sid) return;
  const old = G;
  if (old && old.sid === st.sid) {
    st.totals.forEach((v, i) => { const d = v - (old.totals[i] || 0); if (d) deltas[i] = (deltas[i] || 0) + d; });
  }
  G = st;
  // 새 소식 (다른 친구가 우리 모둠에 영향을 준 일)
  const fresh = (st.feed || []).filter(f => f.t > lastFeedT).reverse();
  if (lastFeedT && S && S.group != null) fresh.forEach(f => {
    if (f.id && f.id === S.id) return;
    const mine = (f.d || []).find(x => x[0] === S.group);
    if (mine && f.g !== S.group) toast(`${esc(G.names[f.g] || '')} ${esc(f.who)}: ${esc(f.msg)}`, mine[1] > 0 ? 'up' : 'down');
    else if (mine && f.g === S.group && !quiet) toast(`우리 모둠 ${esc(f.who)}: ${esc(f.msg)}`, mine[1] > 0 ? 'up' : 'down');
  });
  if (st.feed && st.feed.length) lastFeedT = Math.max(lastFeedT, st.feed[0].t);
  if (!lastFeedT) lastFeedT = st.now || Date.now();
}

/* 상태가 바뀌었을 때 화면 정하기 */
function route() {
  if (!G) return;
  if (S && S.sid !== G.sid) { S = null; lsSet(LS_ME, ''); joinMsg = '선생님이 새 수업을 시작했어요. 모둠을 다시 골라 주세요.'; }
  if (S && S.group >= G.n) { S.screen = 'join'; draft.group = null; draft.name = S.name; joinMsg = '모둠 수가 바뀌었어요. 모둠을 다시 골라 주세요.'; }
  if (!S || S.screen === 'join') return;
  const before = S.screen;
  if (G.open === 'closed') { if (!['opening', 'target'].includes(S.phase)) S.screen = 'end'; }
  else if (G.open === 'wait') { if (S.screen !== 'done') S.screen = 'wait'; }
  else {
    if (S.screen === 'wait' || S.screen === 'end') S.screen = S.qi >= limit() ? 'done' : 'game';
    if (S.screen === 'game' && S.phase === 'q' && S.qi >= limit()) finish();
  }
  if (before !== S.screen) {
    if (S.screen === 'game' && before === 'wait') SFX.bell();
    if (S.screen === 'end') SFX.midnight();
  }
}

async function poll() {
  try {
    const st = await api({ action: 'state' });
    const verChanged = G && st && st.ok && (st.setVer !== G.setVer);
    takeState(st);
    if (verChanged && (!S || S.screen === 'join' || S.screen === 'wait' || (S.qi === 0 && S.phase === 'q'))) {
      await loadSet(); if (S && S.qi === 0) { S.order = shuffle(SET.questions.map((_, k) => k)); }
    }
    route();
    if (!(S && S.screen === 'join' && document.activeElement && document.activeElement.id === 'myname')) render();
  } catch (e) {}
}

/* ---------- 화면 ---------- */
function header() {
  const g = S && ['game', 'done'].includes(S.screen);
  const prog = !S ? 0 : S.screen === 'end' ? 1 : S.screen === 'done' ? 1 : Math.min(S.qi / Math.max(limit(), 1), 1);
  return `<header class="top"><div class="brand">${clockSVG(prog)}<div><small>${esc(G && G.setTitle || DEFAULT_SET.title)}</small><h1>자정의 골동품 가게</h1></div></div>
  ${S && S.screen !== 'join' ? `<div class="toolbar">${g && S.screen === 'game' ? `<span class="chip">No. ${Math.min(S.qi + 1, limit())} / ${limit()}</span>` : ''}
    <span class="who"><span style="color:${TEAMC[S.group]}">◆</span> ${esc(G.names[S.group])} · ${esc(S.name)}</span>
    <button class="btn ghost sound" data-act="mute" aria-label="소리 켜기/끄기">${muted ? '🔇' : '🔊'}</button></div>` : ''}</header>`;
}
function board() {
  const mine = S ? S.group : -1;
  const top = Math.max(...G.totals);
  return `<section class="board" aria-label="모둠 점수" style="--tag:url(${IMG.TAG})">${G.totals.map((s, i) => `
   <div class="team ${i === mine ? 'on mine' : ''} ${deltas[i] ? 'bump' : ''}" style="--tilt:${[-1.2, .8, -.5, 1.1, -.9, .6, -.7, 1][i]}deg">
    <span class="nm"><span style="color:${TEAMC[i]}">◆</span>${esc(G.names[i])}${G.shields[i] ? `<span class="sh" title="보호 부적">🧿${G.shields[i] > 1 ? '×' + G.shields[i] : ''}</span>` : ''}${s === top && top > 0 ? '<span class="crownmark" title="1등">👑</span>' : ''}</span>
    <span class="sc"><span data-sc data-to="${s}" data-from="${deltas[i] ? s - deltas[i] : s}">${deltas[i] ? s - deltas[i] : s}</span><small>점</small></span>
    ${deltas[i] ? `<span class="delta ${deltas[i] > 0 ? 'up' : 'down'}">${deltas[i] > 0 ? '+' : ''}${deltas[i]}</span>` : ''}
   </div>`).join('')}</section>`;
}
function feedLine() {
  const f = (G.feed || []).slice(0, 3);
  if (!f.length) return '';
  return `<section class="rumor" aria-label="가게 소식"><span class="rlab">가게 소식</span>${f.map(x => `<span class="ritem"><span style="color:${TEAMC[x.g] || 'var(--brass)'}">◆</span> ${esc(x.who)} · ${esc(x.msg)}</span>`).join('')}</section>`;
}

function joinScreen() {
  const can = draft.group != null && draft.name.trim();
  return `${header()}<section class="setup">
   <div class="hero" role="img" aria-label="안개 낀 골목 끝의 골동품 가게" style="background-image:url(${IMG.DOOR})"></div>
   <div class="intro"><img src="${IMG.GRANDPA}" alt="열쇠를 건네주시는 할아버지"><p class="story">이번 주말에 놀러 오신 할아버지가 낡은 열쇠 하나를 건네주셨어요. 열쇠 고리에는 <em>“Open it at midnight.”</em>라고 적혀 있어요. 열쇠가 맞는 곳은 골목 끝의 오래된 골동품 가게. 시계가 자정을 치기 전에 주인 할머니의 질문에 답하면 봉인된 상자를 열 수 있어요. 오늘은 <em>모둠 친구들이 각자</em> 가게에 들어가요. 내가 연 상자의 점수는 <em>우리 모둠 점수</em>로 모여요!</p></div>
   ${joinMsg ? `<p class="tnote">${esc(joinMsg)}</p>` : ''}
   ${G.open === 'closed' ? `<p class="tnote">지금은 자정이 지나 가게 문이 닫혀 있어요. 선생님이 문을 다시 열면 들어갈 수 있어요.</p>` : ''}
   <div class="step"><span class="lab"><span class="num">1</span>우리 모둠을 골라요</span>
    <div class="gpick" role="group" aria-label="모둠 고르기">${G.names.map((n, i) => `<button data-act="g" data-i="${i}" aria-pressed="${draft.group === i}" style="--gc:${TEAMC[i]}"><span class="gdot"></span>${esc(n)}</button>`).join('')}</div></div>
   <div class="step"><span class="lab"><span class="num">2</span>번호와 이름을 써요</span>
    <input id="myname" class="nameinput" value="${esc(draft.name)}" maxlength="14" placeholder="예: 7 김하늘" autocomplete="off"></div>
   <details class="catwrap"><summary>가게에 잠든 물건들 보기</summary>
    <div class="catalog">${ITEMS.map(x => `<div class="cat ${x.kind}"><img src="${IMG[x.id]}" alt=""><span><b>${x.name}</b>${x.fx}</span></div>`).join('')}</div></details>
   <div class="keyrow"><div class="keyimg"><img src="${IMG.KEY}" alt="꼬리표가 달린 낡은 열쇠"><span>Open it<br>at midnight.</span></div>
    <button class="btn" data-act="join" ${can && !busy && G.open !== 'closed' ? '' : 'disabled'}>${busy ? '문을 여는 중…' : '열쇠로 문 열기'}</button></div>
  </section>`;
}
function waitScreen() {
  return `${header()}${board()}<section class="shelf waitcard"><img class="waitimg" src="${IMG.DOOR}" alt="">
   <h2>가게 문이 아직 잠겨 있어요</h2><p>${esc(G.names[S.group])} 친구들이 모이고 있어요. 선생님이 문을 열면 바로 시작돼요.</p>
   <p class="rulemini">질문에 답하기 → 맞히면 상자 열기 → 상자 점수는 <b>우리 모둠 점수</b>에 더해져요. 다른 모둠이 보낸 저주가 날아올 수도 있으니 조심!</p>
   ${S.qi === 0 ? `<button class="btn ghost" data-act="regroup">모둠 다시 고르기</button>` : ''}
   ${voiceRow()}</section>`;
}
function passageHTML(k) {
  const p = pas(k); if (!p) return '';
  return `<div class="passage"><h3>${esc(p.title)}</h3>${p.lines.map(l => `<p>${esc(l)}</p>`).join('')}<button class="speak" data-act="speak" data-p="${k}">🔊 들려주기</button></div>`;
}
function keeperLine() {
  const n = esc(S.name.replace(/^\d+\s*(번)?\s*/, '') || S.name);
  if (S.phase === 'right') return ['호호, 맞았구나! 선반의 상자 하나를 열어 보렴.', '제법인걸? 봉인을 뜯을 자격이 있구나.', '옳지! 상자들이 너를 기다리고 있단다.'][S.qi % 3];
  if (S.phase === 'wrong') return ['어머나, 아쉽구나. 시계가 또 한 칸 움직였어.', '쯧쯧, 정답은 장부에 적어 두었단다.', '이런, 상자는 다음 기회에 열어야겠구나.'][S.qi % 3];
  return [`자, ${n}. 내 장부의 질문에 답해 보렴.`, `${n}, 이번 질문은 조금 까다롭단다.`, `어디 보자… ${n}, 이 문제를 풀 수 있겠니?`][S.qi % 3];
}
function ledger() {
  const q = Q(), shown = S.phase !== 'q';
  const en = q.en ? `<span class="en">${esc(q.en).replace(/_{2,}/g, '<span class="blank">?</span>').replace(/\n/g, '<br>')}${/[a-z]/i.test(q.en) && !/[가-힣]/.test(q.en) ? ` <button class="speak mini" data-act="say" aria-label="영어 문장 듣기">🔊</button>` : ''}</span>` : '';
  const ch = q.c.map((c, i) => {
    let cls = 'choice' + (isKr(q) ? ' kr' : ''); if (shown) { if (i === q.a) cls += ' right'; else if (i === S.picked) cls += ' wrong'; }
    return `<button class="${cls}" data-act="ans" data-i="${i}" ${shown ? 'disabled' : ''}><span class="k">${i + 1}</span>${esc(c)}</button>`;
  }).join('');
  let v = '';
  if (S.phase === 'right') v = `<div class="verdict ok"><span>정답이에요. 선반의 상자를 열 수 있어요.</span><button class="btn" data-act="tobox">상자 앞으로</button></div>`;
  if (S.phase === 'wrong') v = `<div class="verdict no"><span>시계가 한 칸 움직였어요. 정답은 ${q.a + 1}번.<small>${esc(q.c[q.a])}</small></span><button class="btn" data-act="next">${S.qi + 1 >= limit() ? '마지막 질문 끝!' : '다음 질문'}</button></div>`;
  const kimg = (S.phase === 'right' && IMG.KEEPER_OK) || (S.phase === 'wrong' && IMG.KEEPER_NO) || IMG.KEEPER;
  return `<section class="ledger" aria-live="polite" style="--ledger:url(${IMG.LEDGER})">
   <div class="keeper ${S.phase}"><img src="${kimg}" alt="골동품 가게 주인 할머니">
    <div class="bubble"><div class="qhead"><span class="tag">${esc(q.t)}</span><span class="turn"><span style="color:${TEAMC[S.group]}">◆</span> ${esc(S.name)}</span></div>
    <p class="say">${keeperLine()}</p></div></div>
   <div class="qbody ${q.p && pas(q.p) ? '' : 'solo'}">${q.p ? passageHTML(q.p) : ''}<div><p class="qtext">${S.qi + 1}. ${esc(q.q)}${en}</p><div class="choices">${ch}</div></div></div>
   ${v}</section>`;
}
function shelf() {
  const opened = S.chosen != null; let bottom = '';
  if (S.phase === 'target') {
    const id = S.boxes[S.chosen];
    const lab = { steal: '검은 고양이가 어느 모둠의 점수를 훔쳐 올까요?', ghost: '유령이 우리 모둠 10점을 들고 어느 모둠에 갈까요?', pass: '저주를 어느 모둠에 넘길까요?' }[id];
    bottom = `<p class="result">${lab}</p><div class="targets">${G.totals.map((_, i) => i).filter(i => i !== S.group).map(i => `<button data-act="target" data-i="${i}"><span style="color:${TEAMC[i]}">◆</span> ${esc(G.names[i])} · ${G.totals[i]}점${G.shields[i] ? ' 🧿' : ''}</button>`).join('')}</div>`;
  } else if (S.phase === 'opening') {
    bottom = S.err ? `<p class="result">${esc(S.err)}</p><button class="btn" data-act="retry">다시 열기</button>` : `<p class="result opening">봉인이 풀리는 중이에요…</p>`;
  } else if (opened) {
    bottom = `<p class="result">${esc(S.msg)}<span class="en">“${esc(item(S.boxes[S.chosen]).en)}”</span></p><button class="btn" data-act="next">${S.qi + 1 >= limit() ? '마지막 질문 끝!' : '다음 질문'}</button>`;
  } else bottom = `<p>마음에 드는 상자를 하나 눌러 보세요.</p>`;
  return `<section class="shelf"><h2>${esc(S.name.replace(/^\d+\s*(번)?\s*/, '') || S.name)}, 봉인을 하나 뜯어 보세요</h2>
   <div class="boxes" style="--seal:url(${IMG.SEAL})">${[0, 3].map(st => `<div class="srow" style="--shelf:url(${IMG.SHELF})"><div class="sbox">${S.boxes.slice(st, st + 3).map((id, j) => {
    const i = st + j, x = item(id), me = S.chosen === i;
    return `<button class="box ${opened ? (me ? 'pick ' + x.kind : 'dim') : ''}" data-act="box" data-i="${i}" ${opened ? 'disabled' : ''} aria-label="${i + 1}번 상자">
     <span class="bimg"><img class="c" src="${IMG[BOXIMG[i]]}" alt=""><img class="o" src="${IMG[x.id === 'zero' ? 'zero' : x.kind === 'b' ? 'openB' : 'openG']}" alt=""></span>
     <span class="tagn">${i + 1}</span>
     ${me ? '' : `<span class="mini ${x.kind}"><img src="${IMG[x.id]}" alt=""><b>${x.name}</b>${x.fx}</span>`}</button>`;
  }).join('')}</div></div>`).join('')}</div>
   ${opened ? reveal(bottom) : bottom}</section>`;
}
function reveal(bottom) {
  const x = item(S.boxes[S.chosen]);
  return `<div class="reveal"><img src="${IMG[x.id]}" alt="${x.name}"><div>
   <span class="kind ${x.kind}">${{ g: '축복', b: '저주', n: '운명' }[x.kind]}</span><h3>${x.name}</h3><p class="fx">${x.fx}</p>${bottom}</div></div>`;
}
function myStats() {
  return `<div class="mystats"><div><span>맞힌 질문</span><b>${S.right} / ${limit()}</b></div><div><span>우리 모둠에 보탠 점수</span><b>${S.myPts > 0 ? '+' : ''}${S.myPts}</b></div><div><span>연 상자</span><b>${S.opened}</b></div></div>`;
}
function doneScreen() {
  return `${header()}${board()}${feedLine()}<section class="shelf waitcard"><img class="waitimg" src="${IMG.KEY}" alt="">
   <h2>모든 질문에 답했어요!</h2><p>시계가 자정을 칠 때까지 모둠 점수판을 지켜보세요. 친구들의 상자가 아직 열리고 있어요.</p>${myStats()}</section>`;
}
function endScreen() {
  const r = G.totals.map((s, i) => ({ s, i })).sort((a, b) => b.s - a.s), top = r[0].s;
  return `${header()}<section class="shelf end" style="--endimg:url(${IMG.END})"><h2>댕… 댕… 자정이 되었어요</h2><p>가게 문이 닫히고, 오늘의 주인공 모둠이 정해졌어요.</p>
   <div class="podium">${r.map((x, k) => `<div class="rank ${x.s === top ? 'first' : ''} ${x.i === S.group ? 'meg' : ''}"><span>${k + 1}위 · ${esc(G.names[x.i])}${x.i === S.group ? ' (우리 모둠)' : ''}</span><span class="pts">${x.s}점</span></div>`).join('')}</div>
   ${myStats()}</section>`;
}
function render() {
  if (!G) return;
  if (!S || S.screen === 'join') app.innerHTML = joinScreen();
  else if (S.screen === 'wait') app.innerHTML = waitScreen();
  else if (S.screen === 'done') app.innerHTML = doneScreen();
  else if (S.screen === 'end') app.innerHTML = endScreen();
  else app.innerHTML = header() + board() + feedLine() + (['box', 'target', 'opening', 'opened'].includes(S.phase) ? shelf() : ledger());
  countUp(app);
  deltas = {};
  saveMe();
}
window.onVoices = () => { if (S && S.screen === 'wait') render(); };

/* ---------- 알림 ---------- */
function toast(html, kind) {
  const box = document.getElementById('toasts'), el = document.createElement('div');
  el.className = 'toast ' + (kind || ''); el.innerHTML = html; box.appendChild(el);
  if (kind === 'down') SFX.bad(); else if (kind === 'up') SFX.saved();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 600); }, 5200);
  while (box.children.length > 3) box.firstChild.remove();
}

/* ---------- 동작 ---------- */
async function join() {
  if (busy) return; busy = true; render();
  const id = (S && S.id) || uid();
  try {
    const r = await api({ action: 'join', sid: G.sid, id, group: draft.group, name: draft.name.trim() }, 3);
    if (!r || !r.ok) { if (r && r.state) takeState(r.state); joinMsg = '들어가지 못했어요. 다시 눌러 주세요.'; busy = false; render(); return; }
    takeState(r, true);
    if (!SET) await loadSet();
    const keep = S && S.sid === G.sid && S.id === id ? S : null;
    S = keep || { sid: G.sid, id, order: shuffle(SET.questions.map((_, k) => k)), qi: 0, phase: 'q', picked: null, boxes: [], chosen: null, target: null, msg: '', myPts: 0, right: 0, opened: 0 };
    S.group = draft.group; S.name = draft.name.trim(); S.screen = 'wait'; joinMsg = '';
    SFX.pick(); route();
  } catch (e) { joinMsg = '인터넷 연결을 확인하고 다시 눌러 주세요.'; }
  busy = false; render();
}
function finish() { S.screen = 'done'; SendQueue.push({ action: 'finish', sid: S.sid, id: S.id }); SFX.good(); }
async function openBox() {
  S.phase = 'opening'; S.err = ''; render();
  const id = S.boxes[S.chosen];
  if (!S.eid) S.eid = uid();
  saveMe();
  try {
    const r = await api({ action: 'box', sid: S.sid, id: S.id, group: S.group, name: S.name, item: id, target: S.target, myPts: S.myPts, eid: S.eid }, 4);
    if (!r || !r.ok) {
      if (r && r.error === 'sid') { takeState(r.state); route(); render(); return; }
      throw new Error('box');
    }
    takeState(r, true);
    S.msg = r.msg; S.myPts += r.mine || 0; S.opened++; S.phase = 'opened'; S.eid = null;
    const k = item(id).kind; setTimeout(() => SFX[k === 'g' ? 'good' : k === 'b' ? 'bad' : 'fate'](), 300);
    route();
  } catch (e) { S.err = '인터넷이 잠깐 끊겼어요. 아래 버튼을 눌러 다시 열어 주세요.'; }
  render();
}
function nextQ() {
  S.qi++; S.phase = 'q'; S.picked = null; S.chosen = null; S.boxes = []; S.msg = ''; S.target = null;
  if (S.qi >= limit()) finish(); else SFX.tick();
  route();
}

app.addEventListener('input', e => { if (e.target.id === 'myname') { draft.name = e.target.value; const b = app.querySelector('[data-act=join]'); if (b) b.disabled = !(draft.group != null && draft.name.trim() && G.open !== 'closed'); } });
app.addEventListener('change', e => { const t = e.target; if (t.dataset.voice != null) { lsSet(LS_VOICE, t.value); sayLines(["Hello! I'm going to read the story."]); } });
app.addEventListener('keydown', e => { if (e.target.id === 'myname' && e.key === 'Enter') join(); });
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'vtest') { sayLines(['My family loves basketball.', "We're going to watch the game this Saturday."]); return; }
  if (a === 'say') { const q = Q(); if (q && q.en) sayLines(q.en.split('\n')); return; }
  if (a === 'speak') { const p = pas(b.dataset.p); if (p) sayLines(p.lines); return; }
  if (a === 'g') { draft.group = i; SFX.pick(); }
  else if (a === 'join') { join(); return; }
  else if (a === 'regroup') { draft.group = S.group; draft.name = S.name; S.screen = 'join'; SFX.click(); }
  else if (a === 'ans') {
    if (S.phase !== 'q') return;
    const q = Q(), ok = i === q.a;
    S.picked = i; S.phase = ok ? 'right' : 'wrong'; if (ok) S.right++;
    SFX[ok ? 'correct' : 'wrong']();
    SendQueue.push({ action: 'answer', sid: S.sid, id: S.id, group: S.group, name: S.name, qi: S.qi, qid: S.order[S.qi], qn: (q.en ? q.q + ' / ' + q.en : q.q).slice(0, 120), ans: q.c[i], ok, eid: uid() });
  }
  else if (a === 'tobox') { SFX.whoosh(); S.boxes = makeBoxes(); S.chosen = null; S.phase = 'box'; }
  else if (a === 'box') {
    if (S.chosen != null) return; S.chosen = i; SFX.open();
    if (item(S.boxes[i]).tgt && G.n > 1) S.phase = 'target'; else { S.target = null; openBox(); return; }
  }
  else if (a === 'target') { S.target = i; SFX.pick(); openBox(); return; }
  else if (a === 'retry') { openBox(); return; }
  else if (a === 'next') nextQ();
  else if (a === 'mute') { muted = !muted; if (!muted) SFX.tick(); }
  render();
});

/* ---------- 시작 ---------- */
document.documentElement.style.setProperty('--shopbg', `url(${IMG.MAIN})`);
(async function boot() {
  let st = null;
  for (let k = 0; k < 6 && !(st && st.ok); k++) {
    try { st = await api({ action: 'state' }); } catch (e) { app.innerHTML = `<p class="loading">가게에 연결하는 중이에요… (${k + 1})</p>`; await new Promise(r => setTimeout(r, 1500)); }
  }
  if (!st || !st.ok) { app.innerHTML = '<p class="loading">가게에 연결하지 못했어요. 인터넷을 확인하고 새로 고침 해 주세요.</p>'; return; }
  takeState(st);
  await loadSet();
  const me = loadMe();
  if (me && me.sid === G.sid && Array.isArray(me.order)) {
    S = me;
    if (S.order.some(k => !SET.questions[k])) S.order = shuffle(SET.questions.map((_, k) => k));
    if (S.phase === 'opening') { S.phase = 'opening'; setTimeout(openBox, 50); }
    draft.group = S.group; draft.name = S.name || '';
  }
  route(); render();
  SendQueue.flush();
  setInterval(poll, 5000);
})();
</script>
